<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>咖啡手沖科學 LLM Wiki｜知識庫與 Workflow 報告</title>
  <style>
    :root {
      --bg: #F7F3EC;
      --surface: #FFFDF9;
      --sidebar: #261B14;
      --sidebar-text: #F2E9DF;
      --sidebar-muted: #B6A494;
      --espresso: #2A1D15;
      --roast: #6B442A;
      --amber: #C47A34;
      --amber-soft: #FBF1E4;
      --border: #E5D9C8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--espresso);
      display: flex;
      min-height: 100vh;
    }
    aside.sidebar {
      width: 290px;
      background: var(--sidebar);
      color: var(--sidebar-text);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-pill {
      background: var(--amber);
      color: #FFFDF9;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #4A382C;
      background: #33251C;
      color: #FFFDF9;
      font-size: 0.88rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--amber); }
    .nav-group-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sidebar-muted);
      margin: 8px 0 6px 6px;
      font-weight: 700;
    }
    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--sidebar-text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      display: block;
      transition: background 0.15s ease;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .nav-btn.active { background: var(--amber); color: #FFFDF9; font-weight: 700; }
    main.content-wrap {
      flex: 1;
      padding: 32px clamp(20px, 4vw, 56px);
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .path-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: #7A6758;
      flex-wrap: wrap;
      gap: 8px;
    }
    .path-chip {
      background: #EDE3D5;
      color: var(--roast);
      padding: 4px 10px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 600;
    }
    article.doc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 36px;
      box-shadow: 0 10px 30px rgba(42, 29, 21, 0.05);
      line-height: 1.75;
    }
    article.doc h1 { font-size: 1.75rem; margin-bottom: 16px; color: var(--espresso); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    article.doc h2 { font-size: 1.25rem; margin: 24px 0 10px; color: var(--roast); }
    article.doc h3 { font-size: 1.05rem; margin: 18px 0 8px; color: var(--espresso); }
    article.doc p { margin-bottom: 12px; font-size: 0.96rem; }
    article.doc ul, article.doc ol { padding-left: 22px; margin-bottom: 14px; }
    article.doc li { margin-bottom: 6px; font-size: 0.95rem; }
    article.doc a { color: var(--roast); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    article.doc a:hover { color: var(--amber); }
    article.doc blockquote {
      background: var(--amber-soft);
      border-left: 4px solid var(--amber);
      padding: 12px 16px;
      border-radius: 10px;
      margin: 16px 0;
      color: var(--espresso);
    }
    article.doc code {
      background: #F2EAE0;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.88em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--roast);
    }
    article.doc pre {
      background: #261B14;
      color: #F7F1E8;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 14px 0;
      font-size: 0.85rem;
      line-height: 1.55;
    }
    article.doc pre code { background: transparent; color: inherit; padding: 0; }
    article.doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.9rem;
    }
    article.doc th, article.doc td {
      border: 1px solid var(--border);
      padding: 9px 12px;
      text-align: left;
      vertical-align: top;
    }
    article.doc th { background: #F4EBDD; color: var(--roast); }
    @media (max-width: 820px) {
      body { flex-direction: column; }
      aside.sidebar { width: 100%; height: auto; position: static; }
      article.doc { padding: 22px 18px; }
    }
  </style>

  <script>
    const PAGES = {"wiki/index.md": {"path": "wiki/index.md", "label": "Wiki 首頁總索引", "html": "<h1>咖啡手沖科學 LLM Wiki 總索引</h1>\n<p>本知識庫依據 <code>AGENTS.md</code> 規範，透過「先討論、後生成」流程建立，共 ingest <strong>6 篇公開來源（S1–S6）</strong>，作為教學型 HTML 簡報的唯一事實基礎。</p>\n<h2>一、原始來源筆記（<code>wiki/sources/</code>）</h2>\n<ul>\n<li><a href=\"sources/S1-golden-cup-standard.md\">S1: The Golden Cup Standard – Roastopedia</a></li>\n<li><a href=\"sources/S2-grind-size-extraction.md\">S2: Grind Size &amp; Coffee Extraction – Perfect Daily Grind</a></li>\n<li><a href=\"sources/S3-water-temperature.md\">S3: Pour-Over Water Temperature by Roast Level – Podium Coffee Club</a></li>\n<li><a href=\"sources/S4-coffee-bloom.md\">S4: Coffee Bloom Explained – The Flaming Bean</a></li>\n<li><a href=\"sources/S5-dripper-geometry.md\">S5: Flat-bottom vs Cone Dripper – TOLO Blog</a></li>\n<li><a href=\"sources/S6-water-chemistry.md\">S6: Water Chemistry for Coffee – Wrexham Bean Co.</a></li>\n</ul>\n<h2>二、核心原理與操作變因（<code>wiki/concepts/</code>）</h2>\n<ul>\n<li><a href=\"concepts/extraction-and-tds.md\">萃取率（PE）與濃度（TDS）</a></li>\n<li><a href=\"concepts/grind-size-and-uniformity.md\">研磨度與粒徑均勻度</a></li>\n<li><a href=\"concepts/water-temperature-and-roast.md\">水溫與烘焙度</a></li>\n<li><a href=\"concepts/blooming-and-co2-degassing.md\">悶蒸與 CO₂ 排氣</a></li>\n<li><a href=\"concepts/dripper-geometry.md\">濾杯幾何：錐形 vs. 平底</a></li>\n<li><a href=\"concepts/water-chemistry.md\">水質化學：礦物質、硬度與鹼度</a></li>\n</ul>\n<h2>三、新手實戰整合（<code>wiki/syntheses/</code>）</h2>\n<ul>\n<li><a href=\"syntheses/beginner-golden-recipe.md\">新手黃金起始配方</a></li>\n<li><a href=\"syntheses/flavor-troubleshooting.md\">手沖風味除錯表</a></li>\n</ul>\n<h2>四、維護紀錄</h2>\n<ul>\n<li><a href=\"log.md\">知識庫 Ingest 與 Lint 日誌（log.md）</a></li>\n</ul>", "raw": "# 咖啡手沖科學 llm wiki 總索引\n\n本知識庫依據 `agents.md` 規範，透過「先討論、後生成」流程建立，共 ingest **6 篇公開來源（s1–s6）**，作為教學型 html 簡報的唯一事實基礎。\n\n## 一、原始來源筆記（`wiki/sources/`）\n- [s1: the golden cup standard – roastopedia](sources/s1-golden-cup-standard.md)\n- [s2: grind size & coffee extraction – perfect daily grind](sources/s2-grind-size-extraction.md)\n- [s3: pour-over water temperature by roast level – podium coffee club](sources/s3-water-temperature.md)\n- [s4: coffee bloom explained – the flaming bean](sources/s4-coffee-bloom.md)\n- [s5: flat-bottom vs cone dripper – tolo blog](sources/s5-dripper-geometry.md)\n- [s6: water chemistry for coffee – wrexham bean co.](sources/s6-water-chemistry.md)\n\n## 二、核心原理與操作變因（`wiki/concepts/`）\n- [萃取率（pe）與濃度（tds）](concepts/extraction-and-tds.md)\n- [研磨度與粒徑均勻度](concepts/grind-size-and-uniformity.md)\n- [水溫與烘焙度](concepts/water-temperature-and-roast.md)\n- [悶蒸與 co₂ 排氣](concepts/blooming-and-co2-degassing.md)\n- [濾杯幾何：錐形 vs. 平底](concepts/dripper-geometry.md)\n- [水質化學：礦物質、硬度與鹼度](concepts/water-chemistry.md)\n\n## 三、新手實戰整合（`wiki/syntheses/`）\n- [新手黃金起始配方](syntheses/beginner-golden-recipe.md)\n- [手沖風味除錯表](syntheses/flavor-troubleshooting.md)\n\n## 四、維護紀錄\n- [知識庫 ingest 與 lint 日誌（log.md）](log.md)\n"}, "AGENTS.md": {"path": "AGENTS.md", "label": "AGENTS.md 員工手冊", "html": "<h1>AGENTS.md — 咖啡手沖科學 LLM Wiki 員工手冊</h1>\n<blockquote>\n<p>本手冊依「先討論、後生成」原則建立，逐條對應使用者確認的 8 項需求摘要。全檔嚴格控制在 12,000 字元以內，只維護此單一規格檔（不重複建立 GEMINI.md；若使用 Claude Code，於 CLAUDE.md 撰寫 <code>@AGENTS.md</code> 共用）。</p>\n</blockquote>\n<h2>1. 專案目標與讀者定位</h2>\n<ul>\n<li><strong>主題</strong>：咖啡手沖科學（Pour-Over Coffee Science）。</li>\n<li><strong>目標讀者</strong>：完全沒接觸過手沖咖啡的新手，不假設讀者預先知道 TDS、萃取率（Extraction Yield）、鹼度緩衝等專有名詞。</li>\n<li><strong>語言規範</strong>：以繁體中文撰寫，專有名詞首次出現時附英文對照（如：萃取率 Extraction Yield、悶蒸 Blooming）。</li>\n</ul>\n<h2>2. 知識庫架構與單向事實防線</h2>\n<ul>\n<li><code>raw/</code>：<strong>唯讀事實來源區</strong>，存放 S1–S6 原始公開文章的擷取摘要與原文 URL。嚴禁 AI 修改 <code>raw/</code> 內的原始數據或結論。</li>\n<li><code>wiki/sources/</code>：單篇來源筆記（一篇一檔，忠實整理該來源的論點與數據）。</li>\n<li><code>wiki/concepts/</code>：核心原理與操作變因詞條（跨來源統整，標註每條事實出處）。</li>\n<li><code>wiki/syntheses/</code>：新手實戰整合頁（黃金起始配方、風味除錯指南）。</li>\n<li><code>wiki/index.md</code>：全站目錄與知識關聯索引。</li>\n<li><code>wiki/log.md</code>：每次 ingest、lint 與衝突修正的歷史紀錄。</li>\n</ul>\n<h2>3. 出處標註與衝突處理規則</h2>\n<ul>\n<li><strong>出處粒度</strong>：每一項科學數值、建議範圍與實驗結論皆須標註來源編號（如 <code>[S1]</code>）與原文連結；產出簡報時，每一頁底部皆須列出對應的 Wiki 頁面路徑與來源編號。</li>\n<li><strong>跨來源矛盾處理</strong>：禁止私自忽略、覆蓋或憑空猜測。遇來源間數值或術語衝突（例如 S2 將濾沖 TDS 與萃取率數值混淆，或 S1 與 S6 的鈣硬度範圍差異），必須於對應詞條以 <code>&gt; ⚠️ 跨來源衝突註記</code> 區塊並列雙方說法，並對照 SCA 標準說明差異。</li>\n</ul>\n<h2>4. Ingest 與版控作業流程</h2>\n<ul>\n<li>採<strong>單篇依序 ingest</strong>（一次一篇）：讀取 <code>raw/Sx-*.md</code> → 建立 <code>wiki/sources/Sx-*.md</code> → 同步更新受影響的 <code>wiki/concepts/</code>、<code>wiki/syntheses/</code>、<code>wiki/index.md</code> 與 <code>wiki/log.md</code> → 執行 <code>git commit</code>。</li>\n<li>嚴禁引入未收錄於 <code>raw/</code> 的外部數據或憑空補充實驗數字。</li>\n</ul>\n<h2>5. 品質檢查（Lint）與驗收標準</h2>\n<ul>\n<li>「做完了」不是 AI 說了算，是腳本說了算。</li>\n<li>每次 ingest 完成後必須執行 <code>python3 scripts/lint_wiki.py</code>，確認通過：</li>\n<li>零孤島頁面（所有 <code>wiki/</code> 子頁皆於 <code>wiki/index.md</code> 被連結）。</li>\n<li>零斷鏈（所有相對 Markdown 連結目標皆存在）。</li>\n<li>出處完整性（每個詞條頁皆含 <code>[S1]</code>–<code>[S6]</code> 來源標記與原文 URL）。</li>\n<li>衝突標記存在（跨來源矛盾點已於詞條中明示）。</li>\n</ul>\n<h2>6. 下游產出與 Graph Workflow</h2>\n<ul>\n<li>下游產出為教學型 HTML 簡報（<code>topic-pourover-science/deck.html</code>），頁數控制在 <strong>8–15 頁</strong>。</li>\n<li>完整流程定義於 <code>.agents/workflows/topic-slides.md</code>，並透過 <code>python3 scripts/check_deck.py</code> 進行自動化驗收（頁數、每頁出處、Wiki 頁面存在性、單頁字數上限防溢出）。</li>\n<li><strong>停止條件（煞車）</strong>：單一節點修正最多 3 輪；若檢索到的相關 Wiki 頁面少於 3 頁，立即停下回報資料不足，嚴禁以模型既有知識硬湊。</li>\n</ul>", "raw": "# agents.md — 咖啡手沖科學 llm wiki 員工手冊\n\n> 本手冊依「先討論、後生成」原則建立，逐條對應使用者確認的 8 項需求摘要。全檔嚴格控制在 12,000 字元以內，只維護此單一規格檔（不重複建立 gemini.md；若使用 claude code，於 claude.md 撰寫 `@agents.md` 共用）。\n\n## 1. 專案目標與讀者定位\n- **主題**：咖啡手沖科學（pour-over coffee science）。\n- **目標讀者**：完全沒接觸過手沖咖啡的新手，不假設讀者預先知道 tds、萃取率（extraction yield）、鹼度緩衝等專有名詞。\n- **語言規範**：以繁體中文撰寫，專有名詞首次出現時附英文對照（如：萃取率 extraction yield、悶蒸 blooming）。\n\n## 2. 知識庫架構與單向事實防線\n- `raw/`：**唯讀事實來源區**，存放 s1–s6 原始公開文章的擷取摘要與原文 url。嚴禁 ai 修改 `raw/` 內的原始數據或結論。\n- `wiki/sources/`：單篇來源筆記（一篇一檔，忠實整理該來源的論點與數據）。\n- `wiki/concepts/`：核心原理與操作變因詞條（跨來源統整，標註每條事實出處）。\n- `wiki/syntheses/`：新手實戰整合頁（黃金起始配方、風味除錯指南）。\n- `wiki/index.md`：全站目錄與知識關聯索引。\n- `wiki/log.md`：每次 ingest、lint 與衝突修正的歷史紀錄。\n\n## 3. 出處標註與衝突處理規則\n- **出處粒度**：每一項科學數值、建議範圍與實驗結論皆須標註來源編號（如 `[s1]`）與原文連結；產出簡報時，每一頁底部皆須列出對應的 wiki 頁面路徑與來源編號。\n- **跨來源矛盾處理**：禁止私自忽略、覆蓋或憑空猜測。遇來源間數值或術語衝突（例如 s2 將濾沖 tds 與萃取率數值混淆，或 s1 與 s6 的鈣硬度範圍差異），必須於對應詞條以 `> ⚠️ 跨來源衝突註記` 區塊並列雙方說法，並對照 sca 標準說明差異。\n\n## 4. ingest 與版控作業流程\n- 採**單篇依序 ingest**（一次一篇）：讀取 `raw/sx-*.md` → 建立 `wiki/sources/sx-*.md` → 同步更新受影響的 `wiki/concepts/`、`wiki/syntheses/`、`wiki/index.md` 與 `wiki/log.md` → 執行 `git commit`。\n- 嚴禁引入未收錄於 `raw/` 的外部數據或憑空補充實驗數字。\n\n## 5. 品質檢查（lint）與驗收標準\n- 「做完了」不是 ai 說了算，是腳本說了算。\n- 每次 ingest 完成後必須執行 `python3 scripts/lint_wiki.py`，確認通過：\n  1. 零孤島頁面（所有 `wiki/` 子頁皆於 `wiki/index.md` 被連結）。\n  2. 零斷鏈（所有相對 markdown 連結目標皆存在）。\n  3. 出處完整性（每個詞條頁皆含 `[s1]`–`[s6]` 來源標記與原文 url）。\n  4. 衝突標記存在（跨來源矛盾點已於詞條中明示）。\n\n## 6. 下游產出與 graph workflow\n- 下游產出為教學型 html 簡報（`topic-pourover-science/deck.html`），頁數控制在 **8–15 頁**。\n- 完整流程定義於 `.agents/workflows/topic-slides.md`，並透過 `python3 scripts/check_deck.py` 進行自動化驗收（頁數、每頁出處、wiki 頁面存在性、單頁字數上限防溢出）。\n- **停止條件（煞車）**：單一節點修正最多 3 輪；若檢索到的相關 wiki 頁面少於 3 頁，立即停下回報資料不足，嚴禁以模型既有知識硬湊。\n"}, "wiki/log.md": {"path": "wiki/log.md", "label": "Ingest 與 Lint 維護日誌", "html": "<h1>LLM Wiki 維護與 Ingest 日誌（log.md）</h1>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">步驟</th>\n<th style=\"text-align: left;\">動作</th>\n<th style=\"text-align: left;\">影響檔案</th>\n<th style=\"text-align: left;\">檢查結果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Step 0</td>\n<td style=\"text-align: left;\">需求訪談確認（8 項規格）並建立 <code>AGENTS.md</code></td>\n<td style=\"text-align: left;\"><code>AGENTS.md</code></td>\n<td style=\"text-align: left;\">字元數 &lt; 12,000，逐條符合需求摘要</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 1</td>\n<td style=\"text-align: left;\">匯入 S1（SCA 黃金杯標準）</td>\n<td style=\"text-align: left;\"><code>raw/S1</code>, <code>wiki/sources/S1</code>, <code>wiki/concepts/extraction-and-tds.md</code></td>\n<td style=\"text-align: left;\">通過</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 2</td>\n<td style=\"text-align: left;\">匯入 S2（研磨度與萃取）</td>\n<td style=\"text-align: left;\"><code>raw/S2</code>, <code>wiki/sources/S2</code>, <code>wiki/concepts/grind-size-and-uniformity.md</code></td>\n<td style=\"text-align: left;\">⚠️ 偵測衝突：S2 誤將濾沖 TDS 寫成 18–22%，已標註衝突註記並對照 S1 修正</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 3</td>\n<td style=\"text-align: left;\">匯入 S3（水溫與烘焙度）</td>\n<td style=\"text-align: left;\"><code>raw/S3</code>, <code>wiki/sources/S3</code>, <code>wiki/concepts/water-temperature-and-roast.md</code></td>\n<td style=\"text-align: left;\">通過</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 4</td>\n<td style=\"text-align: left;\">匯入 S4（悶蒸與 CO₂ 排氣）</td>\n<td style=\"text-align: left;\"><code>raw/S4</code>, <code>wiki/sources/S4</code>, <code>wiki/concepts/blooming-and-co2-degassing.md</code></td>\n<td style=\"text-align: left;\">通過</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 5</td>\n<td style=\"text-align: left;\">匯入 S5（濾杯幾何 V60 vs. Kalita）</td>\n<td style=\"text-align: left;\"><code>raw/S5</code>, <code>wiki/sources/S5</code>, <code>wiki/concepts/dripper-geometry.md</code></td>\n<td style=\"text-align: left;\">通過</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Ingest 6</td>\n<td style=\"text-align: left;\">匯入 S6（水質化學）</td>\n<td style=\"text-align: left;\"><code>raw/S6</code>, <code>wiki/sources/S6</code>, <code>wiki/concepts/water-chemistry.md</code></td>\n<td style=\"text-align: left;\">⚠️ 偵測差異：S1 與 S6 鈣硬度區間不同，已並列標註交集 50–85 mg/L</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">Synthesis</td>\n<td style=\"text-align: left;\">跨來源彙整新手黃金配方與風味除錯表</td>\n<td style=\"text-align: left;\"><code>wiki/syntheses/*</code>, <code>wiki/index.md</code></td>\n<td style=\"text-align: left;\">通過 <code>scripts/lint_wiki.py</code> 全項檢驗</td>\n</tr>\n</tbody>\n</table>", "raw": "# llm wiki 維護與 ingest 日誌（log.md）\n\n| 步驟 | 動作 | 影響檔案 | 檢查結果 |\n| :--- | :--- | :--- | :--- |\n| step 0 | 需求訪談確認（8 項規格）並建立 `agents.md` | `agents.md` | 字元數 < 12,000，逐條符合需求摘要 |\n| ingest 1 | 匯入 s1（sca 黃金杯標準） | `raw/s1`, `wiki/sources/s1`, `wiki/concepts/extraction-and-tds.md` | 通過 |\n| ingest 2 | 匯入 s2（研磨度與萃取） | `raw/s2`, `wiki/sources/s2`, `wiki/concepts/grind-size-and-uniformity.md` | ⚠️ 偵測衝突：s2 誤將濾沖 tds 寫成 18–22%，已標註衝突註記並對照 s1 修正 |\n| ingest 3 | 匯入 s3（水溫與烘焙度） | `raw/s3`, `wiki/sources/s3`, `wiki/concepts/water-temperature-and-roast.md` | 通過 |\n| ingest 4 | 匯入 s4（悶蒸與 co₂ 排氣） | `raw/s4`, `wiki/sources/s4`, `wiki/concepts/blooming-and-co2-degassing.md` | 通過 |\n| ingest 5 | 匯入 s5（濾杯幾何 v60 vs. kalita） | `raw/s5`, `wiki/sources/s5`, `wiki/concepts/dripper-geometry.md` | 通過 |\n| ingest 6 | 匯入 s6（水質化學） | `raw/s6`, `wiki/sources/s6`, `wiki/concepts/water-chemistry.md` | ⚠️ 偵測差異：s1 與 s6 鈣硬度區間不同，已並列標註交集 50–85 mg/l |\n| synthesis | 跨來源彙整新手黃金配方與風味除錯表 | `wiki/syntheses/*`, `wiki/index.md` | 通過 `scripts/lint_wiki.py` 全項檢驗 |\n"}, "wiki/concepts/extraction-and-tds.md": {"path": "wiki/concepts/extraction-and-tds.md", "label": "萃取率與濃度 TDS", "html": "<h1>萃取率（Extraction Yield）與濃度（TDS）</h1>\n<p>手沖咖啡之所以「同一包豆子味道差很多」，核心取決於兩個獨立但相關的科學指標：<strong>萃取率（PE）</strong>與<strong>濃度（TDS）</strong> <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</p>\n<h2>核心定義與公式</h2>\n<ul>\n<li><strong>萃取率（Percent Extraction, PE）</strong>：咖啡粉中有多少百分比的可溶性物質被水溶出。公式為 <code>PE (%) = (TDS × 咖啡液重) ÷ 乾粉重 × 100</code> <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>&lt; 18%（萃取不足）</strong>：尖酸、單薄、缺乏甜感 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>18%–22%（SCA 黃金區間）</strong>：酸甜平衡、風味完整 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>&gt; 22%（過度萃取）</strong>：苦澀、乾口、雜味重 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>濃度（Total Dissolved Solids, TDS）</strong>：這杯咖啡液裡溶解物質佔總液重的比例（以折光儀量測），決定喝起來「濃」或「淡」 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>SCA 濾沖目標</strong>：<strong>1.15%–1.35%</strong>（低於 1.15% 偏淡；高於 1.35% 偏濃）<a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n<li><strong>現代感官修正</strong>：UC Davis 咖啡中心（2020–2023）測試 118 位黑咖啡飲用者發現，大眾偏好實際橫跨 <strong>19%–24% PE</strong> 與 <strong>1.1%–1.3% TDS</strong>，並無單一絕對標準 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a>。</li>\n</ul>\n<blockquote>\n<p>⚠️ 跨來源衝突註記：來源 <a href=\"../sources/S2-grind-size-extraction.md\">S2</a>（<a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">Perfect Daily Grind</a>）原文將濾沖咖啡的「理想 TDS」誤寫為 18%–22%。經比對 <a href=\"../sources/S1-golden-cup-standard.md\">S1</a>（SCA 黃金杯標準），<strong>18%–22% 為萃取率（PE）</strong>，濾沖咖啡的 <strong>TDS 應為 1.15%–1.35%</strong>（義式濃縮 TDS 才是 7%–12%）。本 Wiki 保留原始紀錄並以 SCA 定義為準。</p>\n</blockquote>", "raw": "# 萃取率（extraction yield）與濃度（tds）\n\n手沖咖啡之所以「同一包豆子味道差很多」，核心取決於兩個獨立但相關的科學指標：**萃取率（pe）**與**濃度（tds）** [s1](https://roastopedia.com/golden-cup-standard/)。\n\n## 核心定義與公式\n- **萃取率（percent extraction, pe）**：咖啡粉中有多少百分比的可溶性物質被水溶出。公式為 `pe (%) = (tds × 咖啡液重) ÷ 乾粉重 × 100` [s1](https://roastopedia.com/golden-cup-standard/)。\n  - **< 18%（萃取不足）**：尖酸、單薄、缺乏甜感 [s1](https://roastopedia.com/golden-cup-standard/)。\n  - **18%–22%（sca 黃金區間）**：酸甜平衡、風味完整 [s1](https://roastopedia.com/golden-cup-standard/)。\n  - **> 22%（過度萃取）**：苦澀、乾口、雜味重 [s1](https://roastopedia.com/golden-cup-standard/)。\n- **濃度（total dissolved solids, tds）**：這杯咖啡液裡溶解物質佔總液重的比例（以折光儀量測），決定喝起來「濃」或「淡」 [s1](https://roastopedia.com/golden-cup-standard/)。\n  - **sca 濾沖目標**：**1.15%–1.35%**（低於 1.15% 偏淡；高於 1.35% 偏濃）[s1](https://roastopedia.com/golden-cup-standard/)。\n- **現代感官修正**：uc davis 咖啡中心（2020–2023）測試 118 位黑咖啡飲用者發現，大眾偏好實際橫跨 **19%–24% pe** 與 **1.1%–1.3% tds**，並無單一絕對標準 [s1](https://roastopedia.com/golden-cup-standard/)。\n\n> ⚠️ 跨來源衝突註記：來源 [s2](../sources/s2-grind-size-extraction.md)（[perfect daily grind](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)）原文將濾沖咖啡的「理想 tds」誤寫為 18%–22%。經比對 [s1](../sources/s1-golden-cup-standard.md)（sca 黃金杯標準），**18%–22% 為萃取率（pe）**，濾沖咖啡的 **tds 應為 1.15%–1.35%**（義式濃縮 tds 才是 7%–12%）。本 wiki 保留原始紀錄並以 sca 定義為準。\n"}, "wiki/concepts/grind-size-and-uniformity.md": {"path": "wiki/concepts/grind-size-and-uniformity.md", "label": "研磨度與粒徑均勻度", "html": "<h1>研磨度與粒徑均勻度（Grind Size &amp; Uniformity）</h1>\n<p>研磨度是手沖咖啡中最具影響力的操作變因之一，直接控制咖啡粉的<strong>表面積</strong>與水流穿過粉床的<strong>阻力</strong> <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a>。</p>\n<h2>核心物理機制</h2>\n<ul>\n<li><strong>表面積決定萃取速度</strong>：磨得越細，總表面積越大、萃取越快，需要較短接觸時間；磨得越粗，表面積越小，需要較長接觸時間（如手沖濾泡約 2.5–4 分鐘，對比義式濃縮 25–40 秒）<a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a>。</li>\n<li><strong>沙子與鵝卵石類比（水流阻力）</strong>：水流穿過鵝卵石（粗粉）比沙子（細粉）快得多 <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a>。</li>\n<li><strong>通道效應（Channeling）</strong>：磨得過細或細粉過多時，粉床阻力過高，熱水會鑽阻力最小的路徑快速流過，造成局部過度萃取（苦）與其餘區域萃取不足（酸）並存的雜味 <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a>。</li>\n<li><strong>粒徑均勻度優先於粗細</strong>：專家 Scott Rao 與 Chahan Yeretzian 教授均強調，無論粗細設定為何，<strong>研磨粒徑是否均勻</strong>與磨豆機刀盤校準才是乾淨萃取的關鍵 <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a>。</li>\n<li><strong>與濾杯及水溫的連動</strong>：平底濾杯起點約中度研磨（600–800 µm），錐形濾杯可略細 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>；高水溫時可略調粗避免過萃，低水溫則略調細補償 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n</ul>", "raw": "# 研磨度與粒徑均勻度（grind size & uniformity）\n\n研磨度是手沖咖啡中最具影響力的操作變因之一，直接控制咖啡粉的**表面積**與水流穿過粉床的**阻力** [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)。\n\n## 核心物理機制\n- **表面積決定萃取速度**：磨得越細，總表面積越大、萃取越快，需要較短接觸時間；磨得越粗，表面積越小，需要較長接觸時間（如手沖濾泡約 2.5–4 分鐘，對比義式濃縮 25–40 秒）[s1](https://roastopedia.com/golden-cup-standard/) [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)。\n- **沙子與鵝卵石類比（水流阻力）**：水流穿過鵝卵石（粗粉）比沙子（細粉）快得多 [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)。\n- **通道效應（channeling）**：磨得過細或細粉過多時，粉床阻力過高，熱水會鑽阻力最小的路徑快速流過，造成局部過度萃取（苦）與其餘區域萃取不足（酸）並存的雜味 [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)。\n- **粒徑均勻度優先於粗細**：專家 scott rao 與 chahan yeretzian 教授均強調，無論粗細設定為何，**研磨粒徑是否均勻**與磨豆機刀盤校準才是乾淨萃取的關鍵 [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)。\n- **與濾杯及水溫的連動**：平底濾杯起點約中度研磨（600–800 µm），錐形濾杯可略細 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)；高水溫時可略調粗避免過萃，低水溫則略調細補償 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n"}, "wiki/concepts/water-temperature-and-roast.md": {"path": "wiki/concepts/water-temperature-and-roast.md", "label": "水溫與烘焙度", "html": "<h1>水溫與烘焙度（Water Temperature &amp; Roast Level）</h1>\n<p>水是手沖咖啡的溶劑，溫度越高溶解動力越強；手沖沒有機器緩衝誤差，相差幾度就會明顯改變杯中風味 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</p>\n<h2>SCA 建議區間與烘焙度對應</h2>\n<ul>\n<li><strong>標準建議範圍</strong>：<strong>90–96°C（195–205°F）</strong>（SCA 標準為 93°C ±3°C）<a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n<li><strong>淺焙（Light Roast）</strong>：<strong>93–96°C（200–205°F）</strong> — 豆體密度高、孔隙少，需要較高熱能才能萃出果香與甜感 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n<li><strong>中焙（Medium Roast）</strong>：<strong>92–94°C（198–202°F）</strong> — 兼顧醇厚度與甜感的平衡點 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n<li><strong>深焙（Dark Roast）</strong>：<strong>90–92°C（195–198°F）</strong> — 烘焙使纖維疏鬆、極易溶解，降溫可避免萃出過多苦澀單寧與綠原酸 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n</ul>\n<h2>實用控溫技巧</h2>\n<ul>\n<li><strong>沒有溫控壺怎麼辦</strong>：海平面沸水（100°C）離火靜置 <strong>30–45 秒</strong>即落在約 93–96°C；靜置約 90 秒接近 90°C <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</li>\n<li><strong>海拔修正</strong>：高海拔地區水的沸點較低（例如海拔 5,280 英尺處沸點約 94.4°C），不需久候降溫 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n</ul>", "raw": "# 水溫與烘焙度（water temperature & roast level）\n\n水是手沖咖啡的溶劑，溫度越高溶解動力越強；手沖沒有機器緩衝誤差，相差幾度就會明顯改變杯中風味 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n\n## sca 建議區間與烘焙度對應\n- **標準建議範圍**：**90–96°c（195–205°f）**（sca 標準為 93°c ±3°c）[s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n- **淺焙（light roast）**：**93–96°c（200–205°f）** — 豆體密度高、孔隙少，需要較高熱能才能萃出果香與甜感 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n- **中焙（medium roast）**：**92–94°c（198–202°f）** — 兼顧醇厚度與甜感的平衡點 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n- **深焙（dark roast）**：**90–92°c（195–198°f）** — 烘焙使纖維疏鬆、極易溶解，降溫可避免萃出過多苦澀單寧與綠原酸 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n\n## 實用控溫技巧\n- **沒有溫控壺怎麼辦**：海平面沸水（100°c）離火靜置 **30–45 秒**即落在約 93–96°c；靜置約 90 秒接近 90°c [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n- **海拔修正**：高海拔地區水的沸點較低（例如海拔 5,280 英尺處沸點約 94.4°c），不需久候降溫 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n"}, "wiki/concepts/blooming-and-co2-degassing.md": {"path": "wiki/concepts/blooming-and-co2-degassing.md", "label": "悶蒸與 CO₂ 排氣", "html": "<h1>悶蒸（Blooming）與二氧化碳排氣（CO₂ Degassing）</h1>\n<p>悶蒸是手沖第一步「先倒少量熱水並暫停 30–45 秒」的關鍵步驟，讓咖啡粉內殘留的 <strong>CO₂</strong> 排出，確保後續主注水均勻萃取 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</p>\n<h2>科學原理</h2>\n<ul>\n<li><strong>亨利定律（Henry's Law）</strong>：水溫上升時，水溶解氣體的能力下降，迫使烘焙過程中鎖在咖啡豆細胞內的 CO₂ 迅速形成氣泡逸出 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n<li><strong>為何跳過悶蒸會不好喝</strong>：</li>\n<li>逸出的氣體會物理性推開熱水，造成水流不均與<strong>通道效應</strong> <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n<li>CO₂ 溶於水會形成<strong>碳酸（Carbonic Acid）</strong>，帶來尖酸與平淡口感 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n<li>盲測（Serious Eats）顯示有悶蒸的咖啡在醇厚度、圓潤度與香氣清晰度上皆明顯勝出 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n</ul>\n<h2>標準操作與新鮮度判斷</h2>\n<ul>\n<li><strong>水量與時間</strong>：使用約 <strong>2 倍粉重的熱水</strong>（如 15 g 粉配 30 g 水，20 g 粉配 40 g 水），水溫 <strong>90–96°C</strong>，靜置 <strong>30–45 秒</strong>（超過 60 秒會使粉床明顯降溫）<a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n<li><strong>擾動原則</strong>：注完悶蒸水後<strong>輕搖濾杯（gentle swirl）</strong>有助均勻浸濕，避免劇烈攪拌把細粉沖到底部阻塞濾紙 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n<li><strong>肉眼診斷新鮮度</strong>：豆子通常在烘焙後 <strong>5–14 天</strong>達風味高峰；悶蒸劇烈鼓脹代表新鮮，毫無冒泡則多半已放置超過 3 週或包裝漏氣 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a>。</li>\n</ul>", "raw": "# 悶蒸（blooming）與二氧化碳排氣（co₂ degassing）\n\n悶蒸是手沖第一步「先倒少量熱水並暫停 30–45 秒」的關鍵步驟，讓咖啡粉內殘留的 **co₂** 排出，確保後續主注水均勻萃取 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n\n## 科學原理\n- **亨利定律（henry's law）**：水溫上升時，水溶解氣體的能力下降，迫使烘焙過程中鎖在咖啡豆細胞內的 co₂ 迅速形成氣泡逸出 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n- **為何跳過悶蒸會不好喝**：\n  1. 逸出的氣體會物理性推開熱水，造成水流不均與**通道效應** [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n  2. co₂ 溶於水會形成**碳酸（carbonic acid）**，帶來尖酸與平淡口感 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n  3. 盲測（serious eats）顯示有悶蒸的咖啡在醇厚度、圓潤度與香氣清晰度上皆明顯勝出 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n\n## 標準操作與新鮮度判斷\n- **水量與時間**：使用約 **2 倍粉重的熱水**（如 15 g 粉配 30 g 水，20 g 粉配 40 g 水），水溫 **90–96°c**，靜置 **30–45 秒**（超過 60 秒會使粉床明顯降溫）[s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n- **擾動原則**：注完悶蒸水後**輕搖濾杯（gentle swirl）**有助均勻浸濕，避免劇烈攪拌把細粉沖到底部阻塞濾紙 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n- **肉眼診斷新鮮度**：豆子通常在烘焙後 **5–14 天**達風味高峰；悶蒸劇烈鼓脹代表新鮮，毫無冒泡則多半已放置超過 3 週或包裝漏氣 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)。\n"}, "wiki/concepts/dripper-geometry.md": {"path": "wiki/concepts/dripper-geometry.md", "label": "濾杯幾何（V60 vs. 平底）", "html": "<h1>濾杯幾何學：錐形（V60）vs. 平底（Kalita Wave）</h1>\n<p>濾杯的形狀改變粉床厚度與排水阻力，即使使用同一包豆子與相同水溫，也會呈現截然不同的酸甜比例 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</p>\n<h2>兩大幾何結構比較</h2>\n<ul>\n<li><strong>錐形濾杯（代表：Hario V60）</strong>：</li>\n<li>結構：60° 錐體、單一大圓孔與螺旋肋骨 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n<li>特性：流速主要由注水手法與研磨度決定，變化彈性大、酸質明亮清晰，但注水不穩時容易萃取不均 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n<li><strong>平底濾杯（代表：Kalita Wave、Orea O1）</strong>：</li>\n<li>結構：平坦底部讓粉床厚度由中心到邊緣一致；Kalita Wave 具三小排水孔與波浪濾紙，減緩流速並提升容錯率 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n<li>特性：排水均勻、出品穩定、甜感與平衡度高，特別適合新手 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n<li><strong>混合型（Origami Dripper M）</strong>：20 道肋骨，可依濾紙切換錐形或平底幾何 <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n</ul>\n<h2>UC Davis 與 SCA 實驗證據（2019）</h2>\n<ul>\n<li>在固定咖啡粉、水溫與流速的對照實驗中（Frost, Ristenpart &amp; Guinard, 2019），受試者可明確分辨兩種幾何差異：半錐形濾籃產出較高濃度（%TDS）；淺焙豆於<strong>平底濾籃</strong>展現較多<strong>果乾、甜感與花香</strong>，於<strong>半錐形</strong>則展現較多<strong>柑橘、莓果與酸質</strong> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a>。</li>\n</ul>", "raw": "# 濾杯幾何學：錐形（v60）vs. 平底（kalita wave）\n\n濾杯的形狀改變粉床厚度與排水阻力，即使使用同一包豆子與相同水溫，也會呈現截然不同的酸甜比例 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n\n## 兩大幾何結構比較\n- **錐形濾杯（代表：hario v60）**：\n  - 結構：60° 錐體、單一大圓孔與螺旋肋骨 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n  - 特性：流速主要由注水手法與研磨度決定，變化彈性大、酸質明亮清晰，但注水不穩時容易萃取不均 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n- **平底濾杯（代表：kalita wave、orea o1）**：\n  - 結構：平坦底部讓粉床厚度由中心到邊緣一致；kalita wave 具三小排水孔與波浪濾紙，減緩流速並提升容錯率 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n  - 特性：排水均勻、出品穩定、甜感與平衡度高，特別適合新手 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n- **混合型（origami dripper m）**：20 道肋骨，可依濾紙切換錐形或平底幾何 [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n\n## uc davis 與 sca 實驗證據（2019）\n- 在固定咖啡粉、水溫與流速的對照實驗中（frost, ristenpart & guinard, 2019），受試者可明確分辨兩種幾何差異：半錐形濾籃產出較高濃度（%tds）；淺焙豆於**平底濾籃**展現較多**果乾、甜感與花香**，於**半錐形**則展現較多**柑橘、莓果與酸質** [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)。\n"}, "wiki/concepts/water-chemistry.md": {"path": "wiki/concepts/water-chemistry.md", "label": "水質化學與 SCA 標準", "html": "<h1>水質化學（Water Chemistry）</h1>\n<p>濾沖咖啡有超過 98% 是水，水中礦物質與緩衝物質會直接影響風味萃取與酸度表現 <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</p>\n<h2>三大關鍵水質指標</h2>\n<ul>\n<li><strong>TDS（總溶解固體）</strong>：水中所有溶解離子的總和（鈣、鎂、鈉、碳酸氫鹽等）<a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。SCA 目標 <strong>150 mg/L</strong>（可接受 <strong>75–250 mg/L</strong>）<a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</li>\n<li><strong>硬度（Hardness）</strong>：水中<strong>鈣與鎂</strong>含量。USGS 定義軟水為 0–60 mg/L、中硬水 61–120 mg/L、硬水 121–180 mg/L、極硬水 &gt;180 mg/L（極硬水易結水垢）<a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</li>\n<li><strong>鹼度（Alkalinity）</strong>：水中碳酸氫鹽等中和酸味的能力（緩衝力）；鹼度過高會把咖啡明亮果酸中和掉，讓風味變平淡 <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</li>\n<li><strong>氯與 pH 值</strong>：SCA 要求<strong>總氯 0 mg/L</strong>（避免消毒水異味），理想 <strong>pH 7.0（6.5–7.5）</strong> <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</li>\n</ul>\n<blockquote>\n<p>⚠️ 跨來源衝突註記：SCA 鈣硬度建議範圍在 <a href=\"../sources/S1-golden-cup-standard.md\">S1</a>（Roastopedia）標示為 <strong>50–175 ppm CaCO₃</strong>（鹼度 40–70 ppm），而在 <a href=\"../sources/S6-water-chemistry.md\">S6</a>（Wrexham Bean Co. 引述 SCAA 標準）標示為目標 <strong>68 mg/L（可接受 17–85 mg/L）</strong>（鹼度目標 40 mg/L）。兩者重疊區間 <strong>50–85 mg/L</strong> 屬 USGS 軟至中硬水，是居家手沖最安全的目標帶。</p>\n</blockquote>", "raw": "# 水質化學（water chemistry）\n\n濾沖咖啡有超過 98% 是水，水中礦物質與緩衝物質會直接影響風味萃取與酸度表現 [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n\n## 三大關鍵水質指標\n- **tds（總溶解固體）**：水中所有溶解離子的總和（鈣、鎂、鈉、碳酸氫鹽等）[s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。sca 目標 **150 mg/l**（可接受 **75–250 mg/l**）[s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n- **硬度（hardness）**：水中**鈣與鎂**含量。usgs 定義軟水為 0–60 mg/l、中硬水 61–120 mg/l、硬水 121–180 mg/l、極硬水 >180 mg/l（極硬水易結水垢）[s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n- **鹼度（alkalinity）**：水中碳酸氫鹽等中和酸味的能力（緩衝力）；鹼度過高會把咖啡明亮果酸中和掉，讓風味變平淡 [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n- **氯與 ph 值**：sca 要求**總氯 0 mg/l**（避免消毒水異味），理想 **ph 7.0（6.5–7.5）** [s1](https://roastopedia.com/golden-cup-standard/) [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n\n> ⚠️ 跨來源衝突註記：sca 鈣硬度建議範圍在 [s1](../sources/s1-golden-cup-standard.md)（roastopedia）標示為 **50–175 ppm caco₃**（鹼度 40–70 ppm），而在 [s6](../sources/s6-water-chemistry.md)（wrexham bean co. 引述 scaa 標準）標示為目標 **68 mg/l（可接受 17–85 mg/l）**（鹼度目標 40 mg/l）。兩者重疊區間 **50–85 mg/l** 屬 usgs 軟至中硬水，是居家手沖最安全的目標帶。\n"}, "wiki/syntheses/beginner-golden-recipe.md": {"path": "wiki/syntheses/beginner-golden-recipe.md", "label": "新手黃金起始配方", "html": "<h1>新手黃金起始配方（Beginner Golden Recipe）</h1>\n<p>整合本知識庫 6 篇來源，提供一套可直接照做、具科學依據的新手手沖基準配方 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a> <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a>。</p>\n<h2>基準參數一覽</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">參數</th>\n<th style=\"text-align: left;\">建議基準值</th>\n<th style=\"text-align: left;\">科學依據與出處</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>粉水比</strong></td>\n<td style=\"text-align: left;\"><strong>1:16</strong>（15 g 粉 : 240–250 g 水）</td>\n<td style=\"text-align: left;\">落在 S1 手沖建議（15 g : 250 ml）與 S3（1:15）～S5（1:18）之間 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>研磨度</strong></td>\n<td style=\"text-align: left;\"><strong>中度研磨</strong>（平底 600–800 µm；錐形略細）</td>\n<td style=\"text-align: left;\">平衡表面積與水流阻力，避免通道效應 <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>水溫</strong></td>\n<td style=\"text-align: left;\"><strong>93°C</strong>（淺焙 93–96°C；深焙 90–92°C）</td>\n<td style=\"text-align: left;\">SCA 標準 93°C ±3°C；海平面沸水靜置 30–45 秒 <a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>水質</strong></td>\n<td style=\"text-align: left;\">無氯過濾軟中水（TDS ~150 mg/L，pH ~7.0）</td>\n<td style=\"text-align: left;\">兼顧萃取力與酸度保留，避免氯味與水垢 <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>悶蒸</strong></td>\n<td style=\"text-align: left;\"><strong>30 g 熱水（2 倍粉重），等 30–45 秒</strong></td>\n<td style=\"text-align: left;\">依亨利定律排出 CO₂，輕搖濾杯均勻浸濕 <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>總時間</strong></td>\n<td style=\"text-align: left;\"><strong>2.5–4 分鐘</strong></td>\n<td style=\"text-align: left;\">落在濾泡萃取黃金區間（18–22% PE）<a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>⚠️ 跨來源差異註記：各來源的起始粉水比略有不同（<a href=\"../sources/S3-water-temperature.md\">S3</a> 採 1:15、<a href=\"../sources/S1-golden-cup-standard.md\">S1</a> 手沖採 1:16–1:17、<a href=\"../sources/S5-dripper-geometry.md\">S5</a> 採 1:18）。本配方取中間值 <strong>1:16</strong> 作為新手起點，後續依個人濃淡偏好微調。</p>\n</blockquote>", "raw": "# 新手黃金起始配方（beginner golden recipe）\n\n整合本知識庫 6 篇來源，提供一套可直接照做、具科學依據的新手手沖基準配方 [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper) [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)。\n\n## 基準參數一覽\n| 參數 | 建議基準值 | 科學依據與出處 |\n| :--- | :--- | :--- |\n| **粉水比** | **1:16**（15 g 粉 : 240–250 g 水） | 落在 s1 手沖建議（15 g : 250 ml）與 s3（1:15）～s5（1:18）之間 [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper) |\n| **研磨度** | **中度研磨**（平底 600–800 µm；錐形略細） | 平衡表面積與水流阻力，避免通道效應 [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper) |\n| **水溫** | **93°c**（淺焙 93–96°c；深焙 90–92°c） | sca 標準 93°c ±3°c；海平面沸水靜置 30–45 秒 [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) |\n| **水質** | 無氯過濾軟中水（tds ~150 mg/l，ph ~7.0） | 兼顧萃取力與酸度保留，避免氯味與水垢 [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters) |\n| **悶蒸** | **30 g 熱水（2 倍粉重），等 30–45 秒** | 依亨利定律排出 co₂，輕搖濾杯均勻浸濕 [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom) |\n| **總時間** | **2.5–4 分鐘** | 落在濾泡萃取黃金區間（18–22% pe）[s1](https://roastopedia.com/golden-cup-standard/) [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/) |\n\n> ⚠️ 跨來源差異註記：各來源的起始粉水比略有不同（[s3](../sources/s3-water-temperature.md) 採 1:15、[s1](../sources/s1-golden-cup-standard.md) 手沖採 1:16–1:17、[s5](../sources/s5-dripper-geometry.md) 採 1:18）。本配方取中間值 **1:16** 作為新手起點，後續依個人濃淡偏好微調。\n"}, "wiki/syntheses/flavor-troubleshooting.md": {"path": "wiki/syntheses/flavor-troubleshooting.md", "label": "手沖風味除錯表", "html": "<h1>手沖風味除錯表（Flavor Troubleshooting）</h1>\n<p>調整手沖的黃金原則是：<strong>每次只改變一個變因</strong>（例如只調研磨度或只調水溫），才能準確知道哪項改變解決了問題 <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a>。</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">喝起來的感覺</th>\n<th style=\"text-align: left;\">科學診斷</th>\n<th style=\"text-align: left;\">優先調整方向（一次改一項）</th>\n<th style=\"text-align: left;\">來源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>尖酸、刺激、單薄</strong></td>\n<td style=\"text-align: left;\">萃取不足（PE &lt; 18%）</td>\n<td style=\"text-align: left;\">調<strong>細</strong>研磨度、拉<strong>高</strong>水溫（至該焙度上限），或確保完整悶蒸 30–45 秒</td>\n<td style=\"text-align: left;\"><a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>苦澀、乾口、鎖喉</strong></td>\n<td style=\"text-align: left;\">過度萃取（PE &gt; 22%）</td>\n<td style=\"text-align: left;\">調<strong>粗</strong>研磨度、降<strong>低</strong>水溫（約降 2–3°C），或改用平底濾杯避免局部過萃</td>\n<td style=\"text-align: left;\"><a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a> <a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">S5</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>又酸又苦、雜味混濁</strong></td>\n<td style=\"text-align: left;\">通道效應（Channeling）</td>\n<td style=\"text-align: left;\">檢查磨豆機粒徑均勻度、別磨太細、確實悶蒸排氣並改以輕搖取代用力攪拌</td>\n<td style=\"text-align: left;\"><a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">S2</a> <a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>太淡如水但不酸</strong></td>\n<td style=\"text-align: left;\">濃度偏低（TDS &lt; 1.15%）</td>\n<td style=\"text-align: left;\">檢查粉水比（改以電子秤量重，將比例由 1:18 調整至 1:15–1:16）</td>\n<td style=\"text-align: left;\"><a href=\"https://roastopedia.com/golden-cup-standard/\">S1</a> <a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">S3</a></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>悶蒸毫無冒泡、風味平淡</strong></td>\n<td style=\"text-align: left;\">豆子不新鮮或水質鹼度過高</td>\n<td style=\"text-align: left;\">確認烘焙日期（高峰為 5–14 天內）、檢查單向排氣閥密封；並確認水質無氯且鹼度不過高</td>\n<td style=\"text-align: left;\"><a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">S4</a> <a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">S6</a></td>\n</tr>\n</tbody>\n</table>", "raw": "# 手沖風味除錯表（flavor troubleshooting）\n\n調整手沖的黃金原則是：**每次只改變一個變因**（例如只調研磨度或只調水溫），才能準確知道哪項改變解決了問題 [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)。\n\n| 喝起來的感覺 | 科學診斷 | 優先調整方向（一次改一項） | 來源 |\n| :--- | :--- | :--- | :--- |\n| **尖酸、刺激、單薄** | 萃取不足（pe < 18%） | 調**細**研磨度、拉**高**水溫（至該焙度上限），或確保完整悶蒸 30–45 秒 | [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper) |\n| **苦澀、乾口、鎖喉** | 過度萃取（pe > 22%） | 調**粗**研磨度、降**低**水溫（約降 2–3°c），或改用平底濾杯避免局部過萃 | [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) [s5](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper) |\n| **又酸又苦、雜味混濁** | 通道效應（channeling） | 檢查磨豆機粒徑均勻度、別磨太細、確實悶蒸排氣並改以輕搖取代用力攪拌 | [s2](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/) [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom) |\n| **太淡如水但不酸** | 濃度偏低（tds < 1.15%） | 檢查粉水比（改以電子秤量重，將比例由 1:18 調整至 1:15–1:16） | [s1](https://roastopedia.com/golden-cup-standard/) [s3](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee) |\n| **悶蒸毫無冒泡、風味平淡** | 豆子不新鮮或水質鹼度過高 | 確認烘焙日期（高峰為 5–14 天內）、檢查單向排氣閥密封；並確認水質無氯且鹼度不過高 | [s4](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom) [s6](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters) |\n"}, "wiki/sources/S1-golden-cup-standard.md": {"path": "wiki/sources/S1-golden-cup-standard.md", "label": "[S1] 黃金杯標準", "html": "<h1>[S1] 黃金杯標準（The Golden Cup Standard）</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://roastopedia.com/golden-cup-standard/\">The Golden Cup Standard – Roastopedia</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S1-golden-cup-standard.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/extraction-and-tds.md\">萃取率與濃度 TDS</a>、<a href=\"../syntheses/beginner-golden-recipe.md\">新手黃金起始配方</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>雙指標定義好喝的基準</strong>：源自 1957 年 Dr. Ernest Earl Lockhart 研究並由 SCA 維護的「咖啡沖煮控制圖（Brewing Control Chart）」，以 <strong>TDS（濃度 1.15–1.35%）</strong> 與 <strong>PE（萃取率 18–22%）</strong> 交集定義黃金杯區間 [S1]。</li>\n<li><strong>手沖實作參數</strong>：SCA 基準粉水比為 <strong>55 g/L ±10%（約 1:18）</strong>，手沖實務建議起手式為 <strong>15 g 咖啡粉配 250 ml 水（約 1:16–1:17）</strong>、水溫 <strong>93°C ±3°C</strong>、總接觸時間 <strong>2.5–4 分鐘</strong>，並搭配 2 倍水量悶蒸 30–45 秒 [S1]。</li>\n<li><strong>當代研究修正</strong>：UC Davis 咖啡中心（Cotter et al., 2020/2021；Batali et al., 2023）指出消費者實際偏好區間更寬（<strong>19–24% 萃取率、1.1–1.3% TDS</strong>），且新版控制圖改以描述性風味取代單一「理想」標籤 [S1]。</li>\n</ol>", "raw": "# [s1] 黃金杯標準（the golden cup standard）\n\n- **原始出處**：[the golden cup standard – roastopedia](https://roastopedia.com/golden-cup-standard/)\n- **對應原始檔**：`raw/s1-golden-cup-standard.md`\n- **關聯詞條**：[萃取率與濃度 tds](../concepts/extraction-and-tds.md)、[新手黃金起始配方](../syntheses/beginner-golden-recipe.md)\n\n## 核心重點\n1. **雙指標定義好喝的基準**：源自 1957 年 dr. ernest earl lockhart 研究並由 sca 維護的「咖啡沖煮控制圖（brewing control chart）」，以 **tds（濃度 1.15–1.35%）** 與 **pe（萃取率 18–22%）** 交集定義黃金杯區間 [s1]。\n2. **手沖實作參數**：sca 基準粉水比為 **55 g/l ±10%（約 1:18）**，手沖實務建議起手式為 **15 g 咖啡粉配 250 ml 水（約 1:16–1:17）**、水溫 **93°c ±3°c**、總接觸時間 **2.5–4 分鐘**，並搭配 2 倍水量悶蒸 30–45 秒 [s1]。\n3. **當代研究修正**：uc davis 咖啡中心（cotter et al., 2020/2021；batali et al., 2023）指出消費者實際偏好區間更寬（**19–24% 萃取率、1.1–1.3% tds**），且新版控制圖改以描述性風味取代單一「理想」標籤 [s1]。\n"}, "wiki/sources/S2-grind-size-extraction.md": {"path": "wiki/sources/S2-grind-size-extraction.md", "label": "[S2] 研磨度與萃取", "html": "<h1>[S2] 研磨度與咖啡萃取關係</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/\">Do we need to rethink the relationship between grind size and coffee extraction? – Perfect Daily Grind</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S2-grind-size-extraction.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/grind-size-and-uniformity.md\">研磨度與粒徑均勻度</a>、<a href=\"../concepts/extraction-and-tds.md\">萃取率與濃度 TDS</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>表面積與接觸時間的反比關係</strong>：粗研磨表面積小、需要較長接觸時間；細研磨表面積大、萃取快，若接觸過久會苦澀過度萃取 [S2]。</li>\n<li><strong>浸泡式 vs. 濾泡式</strong>：浸泡式（Immersion）全程接觸水、口感較厚實；濾泡式（Percolation，如手沖）讓水穿過粉床、風味較乾淨 [S2]。</li>\n<li><strong>細粉阻力與通道效應（Channeling）</strong>：用「沙子與鵝卵石」類比水流阻力；磨太細或粒徑不均會造成阻力過高，水流走阻力最小的路徑形成通道效應，導致同一杯同時出現萃取不足與過度萃取 [S2]。</li>\n<li><strong>粒徑均勻度最關鍵</strong>：Scott Rao 與 Chahan Yeretzian 教授一致強調，磨豆機刀盤校準與<strong>粒徑均勻度</strong>比單純調粗細更重要 [S2]。</li>\n</ol>\n<blockquote>\n<p>⚠️ 跨來源衝突註記：S2 原文誤將濾沖咖啡的「理想 TDS」寫成 18%–22%（實為萃取率 PE 數值）；對照 <a href=\"S1-golden-cup-standard.md\">S1</a> SCA 標準，濾沖咖啡理想 TDS 應為 <strong>1.15%–1.35%</strong>，萃取率（PE）才是 <strong>18%–22%</strong>。</p>\n</blockquote>", "raw": "# [s2] 研磨度與咖啡萃取關係\n\n- **原始出處**：[do we need to rethink the relationship between grind size and coffee extraction? – perfect daily grind](https://perfectdailygrind.com/2022/12/the-relationship-between-grind-size-and-coffee-extraction/)\n- **對應原始檔**：`raw/s2-grind-size-extraction.md`\n- **關聯詞條**：[研磨度與粒徑均勻度](../concepts/grind-size-and-uniformity.md)、[萃取率與濃度 tds](../concepts/extraction-and-tds.md)\n\n## 核心重點\n1. **表面積與接觸時間的反比關係**：粗研磨表面積小、需要較長接觸時間；細研磨表面積大、萃取快，若接觸過久會苦澀過度萃取 [s2]。\n2. **浸泡式 vs. 濾泡式**：浸泡式（immersion）全程接觸水、口感較厚實；濾泡式（percolation，如手沖）讓水穿過粉床、風味較乾淨 [s2]。\n3. **細粉阻力與通道效應（channeling）**：用「沙子與鵝卵石」類比水流阻力；磨太細或粒徑不均會造成阻力過高，水流走阻力最小的路徑形成通道效應，導致同一杯同時出現萃取不足與過度萃取 [s2]。\n4. **粒徑均勻度最關鍵**：scott rao 與 chahan yeretzian 教授一致強調，磨豆機刀盤校準與**粒徑均勻度**比單純調粗細更重要 [s2]。\n\n> ⚠️ 跨來源衝突註記：s2 原文誤將濾沖咖啡的「理想 tds」寫成 18%–22%（實為萃取率 pe 數值）；對照 [s1](s1-golden-cup-standard.md) sca 標準，濾沖咖啡理想 tds 應為 **1.15%–1.35%**，萃取率（pe）才是 **18%–22%**。\n"}, "wiki/sources/S3-water-temperature.md": {"path": "wiki/sources/S3-water-temperature.md", "label": "[S3] 水溫與烘焙度", "html": "<h1>[S3] 手沖水溫與烘焙度對應</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee\">Pour-Over Water Temperature by Roast Level – Podium Coffee Club</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S3-water-temperature.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/water-temperature-and-roast.md\">水溫與烘焙度</a>、<a href=\"../syntheses/flavor-troubleshooting.md\">手沖風味診斷表</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>核心水溫區間</strong>：SCA 建議手沖水溫為 <strong>90–96°C（195–205°F）</strong>；水是溶劑，溫度越高溶解力越強，過高易萃出苦澀單寧與綠原酸，過低則酸澀單薄 [S3]。</li>\n<li><strong>依烘焙度微調</strong>：淺焙豆密度高難萃取，建議 <strong>93–96°C（200–205°F）</strong>；中焙 <strong>92–94°C（198–202°F）</strong>；深焙結構較疏鬆易溶解，建議 <strong>90–92°C（195–198°F）</strong> [S3]。</li>\n<li><strong>無溫控壺的做法與海拔影響</strong>：海平面沸水離火靜置 <strong>30–45 秒</strong>約降至 93–96°C；高海拔地區沸點較低（如丹佛約 94.4°C / 202°F），需留意起點溫度 [S3]。</li>\n<li><strong>單一變因除錯原則</strong>：調整風味時<strong>一次只改一個變因</strong>（水溫或研磨度），才能判斷真正原因 [S3]。</li>\n</ol>", "raw": "# [s3] 手沖水溫與烘焙度對應\n\n- **原始出處**：[pour-over water temperature by roast level – podium coffee club](https://podiumcoffeeclub.com/blogs/blog/right-water-temperature-for-pour-over-coffee)\n- **對應原始檔**：`raw/s3-water-temperature.md`\n- **關聯詞條**：[水溫與烘焙度](../concepts/water-temperature-and-roast.md)、[手沖風味診斷表](../syntheses/flavor-troubleshooting.md)\n\n## 核心重點\n1. **核心水溫區間**：sca 建議手沖水溫為 **90–96°c（195–205°f）**；水是溶劑，溫度越高溶解力越強，過高易萃出苦澀單寧與綠原酸，過低則酸澀單薄 [s3]。\n2. **依烘焙度微調**：淺焙豆密度高難萃取，建議 **93–96°c（200–205°f）**；中焙 **92–94°c（198–202°f）**；深焙結構較疏鬆易溶解，建議 **90–92°c（195–198°f）** [s3]。\n3. **無溫控壺的做法與海拔影響**：海平面沸水離火靜置 **30–45 秒**約降至 93–96°c；高海拔地區沸點較低（如丹佛約 94.4°c / 202°f），需留意起點溫度 [s3]。\n4. **單一變因除錯原則**：調整風味時**一次只改一個變因**（水溫或研磨度），才能判斷真正原因 [s3]。\n"}, "wiki/sources/S4-coffee-bloom.md": {"path": "wiki/sources/S4-coffee-bloom.md", "label": "[S4] 悶蒸與排氣", "html": "<h1>[S4] 悶蒸（Blooming）與二氧化碳排氣</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom\">Coffee Bloom Explained: What It Is and Why It Matters – The Flaming Bean</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S4-coffee-bloom.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/blooming-and-co2-degassing.md\">悶蒸與 CO₂ 排氣</a>、<a href=\"../syntheses/beginner-golden-recipe.md\">新手黃金起始配方</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>物理機制（亨利定律 Henry's Law）</strong>：熱水接觸新鮮咖啡粉時，水溫升高降低氣體溶解度，迫使烘焙時鎖在豆體內的 <strong>CO₂</strong> 快速釋放並膨脹冒泡 [S4]。</li>\n<li><strong>為什麼不能跳過悶蒸</strong>：未排出的 CO₂ 會推開水流造成通道效應，且溶於水形成<strong>碳酸（Carbonic Acid）</strong>帶來尖酸平淡感；Serious Eats 盲測證實有悶蒸的咖啡更圓潤飽滿 [S4]。</li>\n<li><strong>標準悶蒸參數</strong>：以 <strong>2 倍粉重熱水</strong>（如 20 g 粉配 40 g 水）、<strong>90–96°C</strong> 均勻浸濕，靜置 <strong>30–45 秒</strong>（超過 60 秒會使水溫明顯下降）；注水後輕搖濾杯（gentle swirl）比用力攪拌更不易讓細粉堵住濾紙 [S4]。</li>\n<li><strong>新鮮度診斷</strong>：烘焙後 <strong>5–14 天</strong>為風味高峰；悶蒸鼓脹明顯代表新鮮，完全不冒泡則代表豆子放置過久（&gt;3 週）或未以單向排氣閥密封保存 [S4]。</li>\n</ol>", "raw": "# [s4] 悶蒸（blooming）與二氧化碳排氣\n\n- **原始出處**：[coffee bloom explained: what it is and why it matters – the flaming bean](https://www.theflamingbean.com/blogs/coffee/what-is-coffee-bloom)\n- **對應原始檔**：`raw/s4-coffee-bloom.md`\n- **關聯詞條**：[悶蒸與 co₂ 排氣](../concepts/blooming-and-co2-degassing.md)、[新手黃金起始配方](../syntheses/beginner-golden-recipe.md)\n\n## 核心重點\n1. **物理機制（亨利定律 henry's law）**：熱水接觸新鮮咖啡粉時，水溫升高降低氣體溶解度，迫使烘焙時鎖在豆體內的 **co₂** 快速釋放並膨脹冒泡 [s4]。\n2. **為什麼不能跳過悶蒸**：未排出的 co₂ 會推開水流造成通道效應，且溶於水形成**碳酸（carbonic acid）**帶來尖酸平淡感；serious eats 盲測證實有悶蒸的咖啡更圓潤飽滿 [s4]。\n3. **標準悶蒸參數**：以 **2 倍粉重熱水**（如 20 g 粉配 40 g 水）、**90–96°c** 均勻浸濕，靜置 **30–45 秒**（超過 60 秒會使水溫明顯下降）；注水後輕搖濾杯（gentle swirl）比用力攪拌更不易讓細粉堵住濾紙 [s4]。\n4. **新鮮度診斷**：烘焙後 **5–14 天**為風味高峰；悶蒸鼓脹明顯代表新鮮，完全不冒泡則代表豆子放置過久（>3 週）或未以單向排氣閥密封保存 [s4]。\n"}, "wiki/sources/S5-dripper-geometry.md": {"path": "wiki/sources/S5-dripper-geometry.md", "label": "[S5] 濾杯幾何比較", "html": "<h1>[S5] 濾杯幾何學：錐形 V60 vs. 平底 Kalita Wave</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper\">Flat-bottom vs cone dripper: Orea, Kalita Wave and V60 – TOLO Blog</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S5-dripper-geometry.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/dripper-geometry.md\">濾杯幾何（錐形 vs. 平底）</a>、<a href=\"../syntheses/beginner-golden-recipe.md\">新手黃金起始配方</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>錐形濾杯（Hario V60）</strong>：60° 錐角、單一大圓孔與螺旋肋骨；流速高度仰賴注水手法與研磨度，風味酸質明亮清晰，但對新手容錯率較低 [S5]。</li>\n<li><strong>平底濾杯（Kalita Wave / Orea O1）</strong>：平底維持均勻粉床深度；Kalita Wave 採三小孔與波浪濾紙減緩流速，對不穩定注水容錯率高，風味平衡甜感佳 [S5]。</li>\n<li><strong>UC Davis 與 SCA 實驗（Frost, Ristenpart &amp; Guinard, 2019）</strong>：固定咖啡、水溫與流速下，半錐形濾籃產出較高濃度（%TDS）；淺焙豆在平底濾籃呈現較多果乾、甜感與花香，半錐形則呈現較多柑橘、莓果與酸質（註：實驗以自動濾泡機進行，手沖作為參考依據）[S5]。</li>\n<li><strong>研磨調整</strong>：平底濾杯建議中度研磨（Orea 約 600–800 µm），錐形可略細一些；TOLO 比較基準粉水比為 <strong>1:18（20 g / 360 g）</strong> [S5]。</li>\n</ol>", "raw": "# [s5] 濾杯幾何學：錐形 v60 vs. 平底 kalita wave\n\n- **原始出處**：[flat-bottom vs cone dripper: orea, kalita wave and v60 – tolo blog](https://www.tolo.cafe/us/blog/flat-bottom-vs-cone-dripper)\n- **對應原始檔**：`raw/s5-dripper-geometry.md`\n- **關聯詞條**：[濾杯幾何（錐形 vs. 平底）](../concepts/dripper-geometry.md)、[新手黃金起始配方](../syntheses/beginner-golden-recipe.md)\n\n## 核心重點\n1. **錐形濾杯（hario v60）**：60° 錐角、單一大圓孔與螺旋肋骨；流速高度仰賴注水手法與研磨度，風味酸質明亮清晰，但對新手容錯率較低 [s5]。\n2. **平底濾杯（kalita wave / orea o1）**：平底維持均勻粉床深度；kalita wave 採三小孔與波浪濾紙減緩流速，對不穩定注水容錯率高，風味平衡甜感佳 [s5]。\n3. **uc davis 與 sca 實驗（frost, ristenpart & guinard, 2019）**：固定咖啡、水溫與流速下，半錐形濾籃產出較高濃度（%tds）；淺焙豆在平底濾籃呈現較多果乾、甜感與花香，半錐形則呈現較多柑橘、莓果與酸質（註：實驗以自動濾泡機進行，手沖作為參考依據）[s5]。\n4. **研磨調整**：平底濾杯建議中度研磨（orea 約 600–800 µm），錐形可略細一些；tolo 比較基準粉水比為 **1:18（20 g / 360 g）** [s5]。\n"}, "wiki/sources/S6-water-chemistry.md": {"path": "wiki/sources/S6-water-chemistry.md", "label": "[S6] 咖啡水質化學", "html": "<h1>[S6] 咖啡水質化學：礦物質、硬度與鹼度</h1>\n<ul>\n<li><strong>原始出處</strong>：<a href=\"https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters\">Water Chemistry for Coffee: A Practical Guide – Wrexham Bean Co.</a></li>\n<li><strong>對應原始檔</strong>：<code>raw/S6-water-chemistry.md</code></li>\n<li><strong>關聯詞條</strong>：<a href=\"../concepts/water-chemistry.md\">水質化學</a>、<a href=\"../syntheses/beginner-golden-recipe.md\">新手黃金起始配方</a></li>\n</ul>\n<h2>核心重點</h2>\n<ol>\n<li><strong>三大水質指標</strong>：<strong>TDS</strong>（水中總溶解固體）、<strong>硬度 Hardness</strong>（鈣鎂離子含量，USGS 分為軟水 0–60、中硬 61–120、硬水 121–180、極硬 &gt;180 mg/L CaCO₃）、<strong>鹼度 Alkalinity</strong>（碳酸氫鹽等中和咖啡酸味的能力）[S6]。</li>\n<li><strong>SCA 沖煮水質建議值（依 S6 引述 SCAA 標準）</strong>：TDS 目標 <strong>150 mg/L</strong>（可接受 75–250 mg/L）、鈣硬度目標 <strong>68 mg/L</strong>（可接受 17–85 mg/L）、總鹼度目標 <strong>40 mg/L</strong>、pH <strong>7.0</strong>（6.5–7.5）、鈉 10 mg/L、<strong>總氯 0 mg/L</strong> [S6]。</li>\n<li><strong>紅旗警訊</strong>：極硬水（&gt;180 mg/L）易產生水垢；含氯自來水會直接破壞咖啡風味；建議新手先查詢當地自來水水質年報作為起點 [S6]。</li>\n</ol>\n<blockquote>\n<p>⚠️ 跨來源衝突註記：S6 引述的 SCA 鈣硬度可接受範圍為 <strong>17–85 mg/L</strong>（總鹼度約 40 mg/L），而 <a href=\"S1-golden-cup-standard.md\">S1</a> 記載 SCA 鈣硬度為 <strong>50–175 ppm CaCO₃</strong>（鹼度 40–70 ppm）。兩者交集落在 <strong>50–85 ppm</strong>，實務上可視為最穩妥的軟中水區間。</p>\n</blockquote>", "raw": "# [s6] 咖啡水質化學：礦物質、硬度與鹼度\n\n- **原始出處**：[water chemistry for coffee: a practical guide – wrexham bean co.](https://wrexhambean.com/blogs/beans-blog/water-chemistry-for-coffee-minerals-softness-and-why-your-tap-matters)\n- **對應原始檔**：`raw/s6-water-chemistry.md`\n- **關聯詞條**：[水質化學](../concepts/water-chemistry.md)、[新手黃金起始配方](../syntheses/beginner-golden-recipe.md)\n\n## 核心重點\n1. **三大水質指標**：**tds**（水中總溶解固體）、**硬度 hardness**（鈣鎂離子含量，usgs 分為軟水 0–60、中硬 61–120、硬水 121–180、極硬 >180 mg/l caco₃）、**鹼度 alkalinity**（碳酸氫鹽等中和咖啡酸味的能力）[s6]。\n2. **sca 沖煮水質建議值（依 s6 引述 scaa 標準）**：tds 目標 **150 mg/l**（可接受 75–250 mg/l）、鈣硬度目標 **68 mg/l**（可接受 17–85 mg/l）、總鹼度目標 **40 mg/l**、ph **7.0**（6.5–7.5）、鈉 10 mg/l、**總氯 0 mg/l** [s6]。\n3. **紅旗警訊**：極硬水（>180 mg/l）易產生水垢；含氯自來水會直接破壞咖啡風味；建議新手先查詢當地自來水水質年報作為起點 [s6]。\n\n> ⚠️ 跨來源衝突註記：s6 引述的 sca 鈣硬度可接受範圍為 **17–85 mg/l**（總鹼度約 40 mg/l），而 [s1](s1-golden-cup-standard.md) 記載 sca 鈣硬度為 **50–175 ppm caco₃**（鹼度 40–70 ppm）。兩者交集落在 **50–85 ppm**，實務上可視為最穩妥的軟中水區間。\n"}, "topic-pourover-science/report.md": {"path": "topic-pourover-science/report.md", "label": "作業繳交完整報告（6 大項）", "html": "<h1>作業繳交報告：用 LLM Wiki 做一份「咖啡手沖科學」教學 HTML 簡報</h1>\n<h2>1. LLM Wiki 主題與簡短介紹</h2>\n<ul>\n<li><strong>主題</strong>：咖啡手沖科學（Pour-Over Coffee Science）</li>\n<li><strong>定位</strong>：透過「先討論、後生成」流程（依課堂第 32 頁 8 項訪談規格確認需求摘要後才建立 <code>AGENTS.md</code>），針對完全沒接觸過手沖咖啡的新手，建立具備<strong>單向事實防線（<code>raw/</code> 唯讀 → <code>wiki/</code> 結構化知識）</strong>的知識庫。</li>\n<li><strong>收錄資料</strong>：共依序 ingest <strong>6 篇公開來源（S1–S6）</strong>，涵蓋 SCA 黃金杯標準（萃取率與 TDS）、研磨度與通道效應、水溫與烘焙度、悶蒸與 CO₂ 排氣、濾杯幾何（錐形 V60 vs. 平底 Kalita Wave）與水質化學，產出 16 份 Wiki 頁面（6 篇來源筆記、6 篇核心概念、2 篇實戰整合、1 份總索引、1 份維護日誌）。</li>\n</ul>\n<h2>2. LLM Wiki 連結與成果</h2>\n<ul>\n<li><strong>可瀏覽網頁版 Wiki</strong>：<code>pourover-llm-wiki.html</code>（含側邊欄導覽、站內關鍵字搜尋、頁內互連、跨來源衝突警示卡與原文出處連結）。</li>\n<li><strong>完整專案檔案</strong>：<code>pourover-llm-wiki-project.zip</code>（含 <code>AGENTS.md</code>（1,701 / 12,000 字元）、<code>raw/</code>、<code>wiki/</code>、<code>scripts/lint_wiki.py</code> 與完整 <code>git</code> commit 紀錄）。</li>\n</ul>\n<h2>3. 教學 HTML 簡報成果</h2>\n<ul>\n<li><strong>可瀏覽教學簡報</strong>：<code>pourover-science-deck.html</code>（共 <strong>11 頁</strong>，支援鍵盤 <code>←/→</code> 換頁、目錄總覽、SVG 黃金杯控制圖與第 10 頁互動式風味除錯診斷器）。</li>\n<li><strong>Wiki 與簡報對應</strong>：每一頁簡報底部皆標註對應的 <code>wiki/*.md</code> 路徑與可點擊的 <code>[S1]</code>–<code>[S6]</code> 原文連結，嚴格只使用 Wiki 與證據卡內容。</li>\n</ul>\n<h2>4. Loop / Graph 流程設計</h2>\n<p>本專案將流程寫成 Workflow Prototype（<code>.agents/workflows/topic-slides.md</code>），採「<strong>大流程用 Graph 控制退回，節點內用 Loop 反覆修正</strong>」：</p>\n<pre><code>[檢索 wiki (sources.md)]\n   │\n   ▼\n(覆蓋率關卡：相關頁 &gt;= 3？) ── 不足 ──▶ [立即停下，不硬湊]\n   │ 通過（命中 14 頁）\n   ▼\n[證據卡 cards/（平行抽取，一篇一卡）]\n   │\n   ▼\n[大綱 outline.md] ──▶ (人工確認關卡) ── 缺子題/調整 ──▶ 退回檢索或大綱\n   │ 通過\n   ▼\n[逐頁稿 drafts/（只能看大綱+對應卡片）] ◀── 節點內 Loop（最多 3 輪，只修出錯頁）\n   │\n   ▼\n(忠實度與密度關卡：scripts/check_drafts.py + 獨立審查)\n   │ 通過\n   ▼\n[渲染 HTML deck.html（嚴禁改字）]\n   │\n   ▼\n(渲染檢查關卡：scripts/check_deck.py + check_web_app.py) ── 溢出 ──▶ 退回逐頁稿\n   │ 通過\n   ▼\n[交件 + report.md]\n</code></pre>\n<ul>\n<li><strong>哪些步驟會重複執行</strong>：</li>\n<li><code>wiki</code> 維護層：每 ingest 一篇新來源就重複執行「建單篇筆記 → 更新概念頁 → 跑 <code>lint_wiki.py</code> → <code>git commit</code>」。</li>\n<li><code>drafts/</code> 逐頁稿層：每次寫完逐頁稿即跑 <code>scripts/check_drafts.py</code>，未過關時<strong>只退回並修改未通過的單頁</strong>（最多 3 輪煞車）。</li>\n<li><code>deck.html</code> 渲染層：產生 HTML 後跑 <code>scripts/check_deck.py</code> 與 <code>check_web_app.py</code> 檢查版面密度、出處與互動控制。</li>\n<li><strong>為什麼這樣設計</strong>：遵循「<strong>大圈很少轉，小圈轉得很快</strong>」與「<strong>每一關只能看指定輸入、不能越權改動</strong>」原則——將資料衝突檢查放在 Wiki Ingest 階段、將字數溢出檢查放在逐頁稿階段，避免等到 HTML 全部渲染完成才發現資料講反或版面爆版而整份重來。</li>\n</ul>\n<h2>5. 一次實際執行的結果與檢查紀錄</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">階段</th>\n<th style=\"text-align: left;\">執行工具／腳本</th>\n<th style=\"text-align: left;\">實際結果</th>\n<th style=\"text-align: left;\">發現問題與處理方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Wiki Lint</strong></td>\n<td style=\"text-align: left;\"><code>python3 scripts/lint_wiki.py</code></td>\n<td style=\"text-align: left;\">16 頁、0 錯誤、5 處衝突註記</td>\n<td style=\"text-align: left;\">Ingest S2 時抓出原文將「濾沖理想 TDS」誤寫為 18–22%（實為萃取率 PE）；Ingest S6 時抓出 S1（50–175 ppm）與 S6（17–85 mg/L）鈣硬度區間差異，皆以 <code>⚠️ 跨來源衝突註記</code> 並列保留並對照 SCA 釐清。</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>覆蓋率關卡</strong></td>\n<td style=\"text-align: left;\"><code>sources.md</code> 檢索統計</td>\n<td style=\"text-align: left;\">命中 14 頁（&gt;= 3 門檻）</td>\n<td style=\"text-align: left;\"><strong>PASS</strong>，進入平行證據卡抽取（<code>card-S1</code>～<code>card-S6</code>）。</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>逐頁稿 Round 1</strong></td>\n<td style=\"text-align: left;\"><code>python3 scripts/check_drafts.py</code></td>\n<td style=\"text-align: left;\"><strong>FAIL（5 個錯誤）</strong></td>\n<td style=\"text-align: left;\"><code>slide-03</code>（331 字）、<code>slide-05</code>（324 字）、<code>slide-06</code>（337 字）、<code>slide-07</code>（335 字）、<code>slide-08</code>（366 字）超過 320 字密度上限，有 HTML 溢出風險；退回逐頁稿節點，<strong>只修這 5 頁、其餘 6 頁不動</strong>。</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>逐頁稿 Round 2</strong></td>\n<td style=\"text-align: left;\"><code>python3 scripts/check_drafts.py</code></td>\n<td style=\"text-align: left;\"><strong>FAIL（1 個錯誤）</strong></td>\n<td style=\"text-align: left;\">4 頁過關，僅 <code>slide-08.md</code> 仍為 338 字（&gt; 320 字）；退回<strong>只修第 8 頁</strong>。</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>逐頁稿 Round 3</strong></td>\n<td style=\"text-align: left;\"><code>python3 scripts/check_drafts.py</code></td>\n<td style=\"text-align: left;\"><strong>PASS（0 錯誤）</strong></td>\n<td style=\"text-align: left;\">11 頁全數通過頁數、出處、<code>wiki/*.md</code> 存在性、字數上限與 S2 術語防護檢查。</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>HTML 渲染驗證</strong></td>\n<td style=\"text-align: left;\"><code>check_deck.py</code> + <code>check_web_app.py</code></td>\n<td style=\"text-align: left;\"><strong>PASS（0 錯誤）</strong></td>\n<td style=\"text-align: left;\">11 頁簡報皆具 <code>.slide-source</code> Wiki 路徑與可點擊 <code>https://</code> 來源連結，互動腳本無語法或死按鈕問題。</td>\n</tr>\n</tbody>\n</table>\n<h2>6. 反思：哪個節點最常出錯？如何調整檢查流程？</h2>\n<ol>\n<li><strong>哪一個節點最常出錯？</strong></li>\n<li><strong>逐頁稿（<code>drafts/</code>）的資訊密度控制</strong>最常出錯（實測第一輪就有 5/11 頁超過字數門檻，第二輪第 8 頁仍超標），其次是<strong>跨來源事實抽取（Ingest / 證據卡）</strong>容易把單一來源的筆誤（如 S2 把濾沖 TDS 誤寫為 18–22%）直接帶進簡報。</li>\n<li><strong>發現問題後，把檢查往前移到了哪一個步驟？</strong></li>\n<li><strong>事實與衝突檢查往前移到「Wiki Ingest ＆ 證據卡」階段</strong>：不在最後審簡報時才靠肉眼發現數字矛盾，而是在 <code>lint_wiki.py</code> 與 <code>card-S2.md</code> 就標記衝突警訊，並在 <code>check_drafts.py</code> 加入正規表達式防護規則，阻止錯誤說法進入渲染層。</li>\n<li><strong>溢出檢查往前移到「逐頁稿（<code>drafts/</code>）」階段</strong>：原本等到 HTML 渲染完才發現字太多跑出畫面（需要退回大圈），改為在 <code>drafts/</code> 階段就用 <code>check_drafts.py</code> 強制卡控單頁字數上限（&lt;= 320 字），讓錯誤在離源頭最近的小圈內就快速修完。</li>\n<li><strong>有沒有因此修改 workflow / graph？為什麼？</strong></li>\n<li><strong>有</strong>。在原本的 Graph 中，將「忠實度與密度檢查」拆成雙層閘門：<strong>程式腳本（<code>check_drafts.py</code>）先擋格式、出處、斷鏈、字數與已知術語地雷</strong>，通過後才進渲染 HTML，並強制規定「渲染節點不可改任何一個字」；這樣既省下反覆重寫 HTML 的成本，也真正落實「做完了不是 AI 說了算，是腳本說了算」。</li>\n</ol>", "raw": "# 作業繳交報告：用 llm wiki 做一份「咖啡手沖科學」教學 html 簡報\n\n## 1. llm wiki 主題與簡短介紹\n- **主題**：咖啡手沖科學（pour-over coffee science）\n- **定位**：透過「先討論、後生成」流程（依課堂第 32 頁 8 項訪談規格確認需求摘要後才建立 `agents.md`），針對完全沒接觸過手沖咖啡的新手，建立具備**單向事實防線（`raw/` 唯讀 → `wiki/` 結構化知識）**的知識庫。\n- **收錄資料**：共依序 ingest **6 篇公開來源（s1–s6）**，涵蓋 sca 黃金杯標準（萃取率與 tds）、研磨度與通道效應、水溫與烘焙度、悶蒸與 co₂ 排氣、濾杯幾何（錐形 v60 vs. 平底 kalita wave）與水質化學，產出 16 份 wiki 頁面（6 篇來源筆記、6 篇核心概念、2 篇實戰整合、1 份總索引、1 份維護日誌）。\n\n## 2. llm wiki 連結與成果\n- **可瀏覽網頁版 wiki**：`pourover-llm-wiki.html`（含側邊欄導覽、站內關鍵字搜尋、頁內互連、跨來源衝突警示卡與原文出處連結）。\n- **完整專案檔案**：`pourover-llm-wiki-project.zip`（含 `agents.md`（1,701 / 12,000 字元）、`raw/`、`wiki/`、`scripts/lint_wiki.py` 與完整 `git` commit 紀錄）。\n\n## 3. 教學 html 簡報成果\n- **可瀏覽教學簡報**：`pourover-science-deck.html`（共 **11 頁**，支援鍵盤 `←/→` 換頁、目錄總覽、svg 黃金杯控制圖與第 10 頁互動式風味除錯診斷器）。\n- **wiki 與簡報對應**：每一頁簡報底部皆標註對應的 `wiki/*.md` 路徑與可點擊的 `[s1]`–`[s6]` 原文連結，嚴格只使用 wiki 與證據卡內容。\n\n## 4. loop / graph 流程設計\n本專案將流程寫成 workflow prototype（`.agents/workflows/topic-slides.md`），採「**大流程用 graph 控制退回，節點內用 loop 反覆修正**」：\n\n```\n[檢索 wiki (sources.md)]\n   │\n   ▼\n(覆蓋率關卡：相關頁 >= 3？) ── 不足 ──▶ [立即停下，不硬湊]\n   │ 通過（命中 14 頁）\n   ▼\n[證據卡 cards/（平行抽取，一篇一卡）]\n   │\n   ▼\n[大綱 outline.md] ──▶ (人工確認關卡) ── 缺子題/調整 ──▶ 退回檢索或大綱\n   │ 通過\n   ▼\n[逐頁稿 drafts/（只能看大綱+對應卡片）] ◀── 節點內 loop（最多 3 輪，只修出錯頁）\n   │\n   ▼\n(忠實度與密度關卡：scripts/check_drafts.py + 獨立審查)\n   │ 通過\n   ▼\n[渲染 html deck.html（嚴禁改字）]\n   │\n   ▼\n(渲染檢查關卡：scripts/check_deck.py + check_web_app.py) ── 溢出 ──▶ 退回逐頁稿\n   │ 通過\n   ▼\n[交件 + report.md]\n```\n\n- **哪些步驟會重複執行**：\n  1. `wiki` 維護層：每 ingest 一篇新來源就重複執行「建單篇筆記 → 更新概念頁 → 跑 `lint_wiki.py` → `git commit`」。\n  2. `drafts/` 逐頁稿層：每次寫完逐頁稿即跑 `scripts/check_drafts.py`，未過關時**只退回並修改未通過的單頁**（最多 3 輪煞車）。\n  3. `deck.html` 渲染層：產生 html 後跑 `scripts/check_deck.py` 與 `check_web_app.py` 檢查版面密度、出處與互動控制。\n- **為什麼這樣設計**：遵循「**大圈很少轉，小圈轉得很快**」與「**每一關只能看指定輸入、不能越權改動**」原則——將資料衝突檢查放在 wiki ingest 階段、將字數溢出檢查放在逐頁稿階段，避免等到 html 全部渲染完成才發現資料講反或版面爆版而整份重來。\n\n## 5. 一次實際執行的結果與檢查紀錄\n| 階段 | 執行工具／腳本 | 實際結果 | 發現問題與處理方式 |\n| :--- | :--- | :--- | :--- |\n| **wiki lint** | `python3 scripts/lint_wiki.py` | 16 頁、0 錯誤、5 處衝突註記 | ingest s2 時抓出原文將「濾沖理想 tds」誤寫為 18–22%（實為萃取率 pe）；ingest s6 時抓出 s1（50–175 ppm）與 s6（17–85 mg/l）鈣硬度區間差異，皆以 `⚠️ 跨來源衝突註記` 並列保留並對照 sca 釐清。 |\n| **覆蓋率關卡** | `sources.md` 檢索統計 | 命中 14 頁（>= 3 門檻） | **pass**，進入平行證據卡抽取（`card-s1`～`card-s6`）。 |\n| **逐頁稿 round 1** | `python3 scripts/check_drafts.py` | **fail（5 個錯誤）** | `slide-03`（331 字）、`slide-05`（324 字）、`slide-06`（337 字）、`slide-07`（335 字）、`slide-08`（366 字）超過 320 字密度上限，有 html 溢出風險；退回逐頁稿節點，**只修這 5 頁、其餘 6 頁不動**。 |\n| **逐頁稿 round 2** | `python3 scripts/check_drafts.py` | **fail（1 個錯誤）** | 4 頁過關，僅 `slide-08.md` 仍為 338 字（> 320 字）；退回**只修第 8 頁**。 |\n| **逐頁稿 round 3** | `python3 scripts/check_drafts.py` | **pass（0 錯誤）** | 11 頁全數通過頁數、出處、`wiki/*.md` 存在性、字數上限與 s2 術語防護檢查。 |\n| **html 渲染驗證** | `check_deck.py` + `check_web_app.py` | **pass（0 錯誤）** | 11 頁簡報皆具 `.slide-source` wiki 路徑與可點擊 `https://` 來源連結，互動腳本無語法或死按鈕問題。 |\n\n## 6. 反思：哪個節點最常出錯？如何調整檢查流程？\n1. **哪一個節點最常出錯？**\n   - **逐頁稿（`drafts/`）的資訊密度控制**最常出錯（實測第一輪就有 5/11 頁超過字數門檻，第二輪第 8 頁仍超標），其次是**跨來源事實抽取（ingest / 證據卡）**容易把單一來源的筆誤（如 s2 把濾沖 tds 誤寫為 18–22%）直接帶進簡報。\n2. **發現問題後，把檢查往前移到了哪一個步驟？**\n   - **事實與衝突檢查往前移到「wiki ingest ＆ 證據卡」階段**：不在最後審簡報時才靠肉眼發現數字矛盾，而是在 `lint_wiki.py` 與 `card-s2.md` 就標記衝突警訊，並在 `check_drafts.py` 加入正規表達式防護規則，阻止錯誤說法進入渲染層。\n   - **溢出檢查往前移到「逐頁稿（`drafts/`）」階段**：原本等到 html 渲染完才發現字太多跑出畫面（需要退回大圈），改為在 `drafts/` 階段就用 `check_drafts.py` 強制卡控單頁字數上限（<= 320 字），讓錯誤在離源頭最近的小圈內就快速修完。\n3. **有沒有因此修改 workflow / graph？為什麼？**\n   - **有**。在原本的 graph 中，將「忠實度與密度檢查」拆成雙層閘門：**程式腳本（`check_drafts.py`）先擋格式、出處、斷鏈、字數與已知術語地雷**，通過後才進渲染 html，並強制規定「渲染節點不可改任何一個字」；這樣既省下反覆重寫 html 的成本，也真正落實「做完了不是 ai 說了算，是腳本說了算」。\n"}, ".agents/workflows/topic-slides.md": {"path": ".agents/workflows/topic-slides.md", "label": "Workflow 規格（/topic-slides）", "html": "<hr />\n<p>name: topic-slides\ndescription: 從 LLM Wiki 透過 Graph + 節點內 Loop 產出教學型 HTML 簡報（只引用 Wiki 內容，每道關卡配可執行腳本）。</p>\n<hr />\n<h1>Workflow Prototype: <code>/topic-slides</code></h1>\n<h2>1. Graph 拓撲結構（對齊課程第 43–47 頁）</h2>\n<pre><code>[檢索 wiki] -&gt; (覆蓋率關卡: 相關頁 &gt;= 3? 不足則停下)\n    -&gt; [證據卡 cards/ (平行抽取, 一篇一卡)]\n    -&gt; [大綱 outline.md]\n    -&gt; (人工確認關卡: 缺子題退回檢索 / 結構不佳退回大綱)\n    -&gt; [逐頁稿 drafts/ (只能看大綱+對應卡片, 節點內 Loop &lt;= 2 輪)]\n    -&gt; (忠實度與密度檢查 scripts/check_drafts.py + 獨立審查: 退回只修該頁)\n    -&gt; [渲染 HTML deck.html (嚴禁改字)]\n    -&gt; (渲染檢查 scripts/check_deck.py + check_web_app.py: 溢出則退回逐頁稿)\n    -&gt; [交件 + report.md]\n</code></pre>\n<h2>2. 每一關的權限邊界（只能看什麼、不能做什麼）</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">節點</th>\n<th style=\"text-align: left;\">只能讀取</th>\n<th style=\"text-align: left;\">嚴格禁止</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">證據卡（<code>cards/</code>）</td>\n<td style=\"text-align: left;\">單一篇 <code>wiki/sources/Sx-*.md</code></td>\n<td style=\"text-align: left;\">混入其他來源或模型外部知識</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">逐頁稿（<code>drafts/</code>）</td>\n<td style=\"text-align: left;\"><code>outline.md</code> + 該頁指定之證據卡與對應 Wiki 詞條</td>\n<td style=\"text-align: left;\">引用卡片以外的新數據</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">渲染 HTML（<code>deck.html</code>）</td>\n<td style=\"text-align: left;\">已通過檢查的 <code>drafts/slide-*.md</code></td>\n<td style=\"text-align: left;\">排版時順手改寫或刪減數據</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">檢查關卡（<code>scripts/</code>）</td>\n<td style=\"text-align: left;\">成品檔 + Wiki 來源</td>\n<td style=\"text-align: left;\">檢查者直接偷改成品（僅產出錯誤報告並退回指定節點）</td>\n</tr>\n</tbody>\n</table>\n<h2>3. 停止條件（Loop 煞車）</h2>\n<ol>\n<li>覆蓋率關卡：檢索到的相關 Wiki 頁面 &lt; 3 頁 → <strong>立即停下</strong>，不以模型知識硬湊。</li>\n<li>單節點重試上限：最多修正 <strong>3 輪</strong>，仍未通過則停下交由人工介入。</li>\n<li>雙重驗證：先跑<strong>程式腳本檢查</strong>（頁數、出處、斷鏈、字數密度），再跑<strong>獨立 AI 忠實度審查</strong>（新上下文只給成品與來源）。</li>\n</ol>", "raw": "---\nname: topic-slides\ndescription: 從 llm wiki 透過 graph + 節點內 loop 產出教學型 html 簡報（只引用 wiki 內容，每道關卡配可執行腳本）。\n---\n\n# workflow prototype: `/topic-slides`\n\n## 1. graph 拓撲結構（對齊課程第 43–47 頁）\n```\n[檢索 wiki] -> (覆蓋率關卡: 相關頁 >= 3? 不足則停下)\n    -> [證據卡 cards/ (平行抽取, 一篇一卡)]\n    -> [大綱 outline.md]\n    -> (人工確認關卡: 缺子題退回檢索 / 結構不佳退回大綱)\n    -> [逐頁稿 drafts/ (只能看大綱+對應卡片, 節點內 loop <= 2 輪)]\n    -> (忠實度與密度檢查 scripts/check_drafts.py + 獨立審查: 退回只修該頁)\n    -> [渲染 html deck.html (嚴禁改字)]\n    -> (渲染檢查 scripts/check_deck.py + check_web_app.py: 溢出則退回逐頁稿)\n    -> [交件 + report.md]\n```\n\n## 2. 每一關的權限邊界（只能看什麼、不能做什麼）\n| 節點 | 只能讀取 | 嚴格禁止 |\n| :--- | :--- | :--- |\n| 證據卡（`cards/`） | 單一篇 `wiki/sources/sx-*.md` | 混入其他來源或模型外部知識 |\n| 逐頁稿（`drafts/`） | `outline.md` + 該頁指定之證據卡與對應 wiki 詞條 | 引用卡片以外的新數據 |\n| 渲染 html（`deck.html`） | 已通過檢查的 `drafts/slide-*.md` | 排版時順手改寫或刪減數據 |\n| 檢查關卡（`scripts/`） | 成品檔 + wiki 來源 | 檢查者直接偷改成品（僅產出錯誤報告並退回指定節點） |\n\n## 3. 停止條件（loop 煞車）\n1. 覆蓋率關卡：檢索到的相關 wiki 頁面 < 3 頁 → **立即停下**，不以模型知識硬湊。\n2. 單節點重試上限：最多修正 **3 輪**，仍未通過則停下交由人工介入。\n3. 雙重驗證：先跑**程式腳本檢查**（頁數、出處、斷鏈、字數密度），再跑**獨立 ai 忠實度審查**（新上下文只給成品與來源）。\n"}, "topic-pourover-science/outline.md": {"path": "topic-pourover-science/outline.md", "label": "簡報大綱與 Wiki 對應", "html": "<h1>Node 3: 教學型 HTML 簡報大綱（<code>outline.md</code>）</h1>\n<ul>\n<li><strong>簡報標題</strong>：為什麼同一包咖啡豆，沖出來味道差這麼多？——咖啡手沖科學新手入門</li>\n<li><strong>目標讀者</strong>：完全沒接觸過手沖咖啡的新手</li>\n<li><strong>總頁數</strong>：11 頁（符合 8–15 頁規格）</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">頁碼</th>\n<th style=\"text-align: left;\">簡報標題（Action Title）</th>\n<th style=\"text-align: left;\">教學目的</th>\n<th style=\"text-align: left;\">對應證據卡 / Wiki 頁面</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">01</td>\n<td style=\"text-align: left;\">封面：咖啡手沖科學入門</td>\n<td style=\"text-align: left;\">拋出核心問題，建立學習動機</td>\n<td style=\"text-align: left;\"><code>wiki/index.md</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">02</td>\n<td style=\"text-align: left;\">一杯咖啡的兩個科學指標：萃取率 vs. 濃度</td>\n<td style=\"text-align: left;\">釐清最容易搞混的 PE 與 TDS（含 S2 衝突查核案例）</td>\n<td style=\"text-align: left;\"><code>card-S1</code>, <code>card-S2</code>, <code>wiki/concepts/extracti i/syntheses/beginner-golden-recipe.md</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">10</td>\n<td style=\"text-align: left;\">喝起來不對勁？手沖風味互動除錯指南</td>\n<td style=\"text-align: left;\">教會「一次只改一個變因」的科學除錯法</td>\n<td style=\"text-align: left;\"><code>wiki/syntheses/flavor-troubleshooting.md</code></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">11</td>\n<td style=\"text-align: left;\">總結與知識來源對應表（Wiki → 簡報）</td>\n<td style=\"text-align: left;\">整理 3 大心法並列出完整 Wiki 頁面與 S1–S6 出處</td>\n<td style=\"text-align: left;\"><code>wiki/index.md</code>, <code>S1</code>–<code>S6</code></td>\n</tr>\n</tbody>\n</table>", "raw": "# node 3: 教學型 html 簡報大綱（`outline.md`）\n\n- **簡報標題**：為什麼同一包咖啡豆，沖出來味道差這麼多？——咖啡手沖科學新手入門\n- **目標讀者**：完全沒接觸過手沖咖啡的新手\n- **總頁數**：11 頁（符合 8–15 頁規格）\n\n| 頁碼 | 簡報標題（action title） | 教學目的 | 對應證據卡 / wiki 頁面 |\n| :--- | :--- | :--- | :--- |\n| 01 | 封面：咖啡手沖科學入門 | 拋出核心問題，建立學習動機 | `wiki/index.md` |\n| 02 | 一杯咖啡的兩個科學指標：萃取率 vs. 濃度 | 釐清最容易搞混的 pe 與 tds（含 s2 衝突查核案例） | `card-s1`, `card-s2`, `wiki/concepts/extraction-and-tds.md` |\n| 03 | 認識黃金杯控制圖：酸、甜、苦如何發生？ | 建立「萃取不足＝酸、過萃＝苦」的直覺地圖 | `card-s1`, `wiki/concepts/extraction-and-tds.md` |\n| 04 | 變因 1｜研磨度：表面積、阻力與通道效應 | 用沙子與鵝卵石類比解釋粗細與粒徑均勻度 | `card-s2`, `wiki/concepts/grind-size-and-uniformity.md` |\n| 05 | 變因 2｜水溫與烘焙度：淺焙用熱、深焙降溫 | 說明溶劑熱能與三種焙度的實戰水溫帶 | `card-s3`, `wiki/concepts/water-temperature-and-roast.md` |\n| 06 | 變因 3｜悶蒸與 co₂ 排氣：別跳過這 30–45 秒 | 用亨利定律解釋為何要排氣、如何看新鮮度 | `card-s4`, `wiki/concepts/blooming-and-co2-degassing.md` |\n| 07 | 變因 4｜濾杯幾何：錐形 v60 vs. 平底 kalita wave | 結合 uc davis 研究比較水流結構與新手選擇 | `card-s5`, `wiki/concepts/dripper-geometry.md` |\n| 08 | 變因 5｜水質化學：98% 都是水，氯與鹼度最關鍵 | 帶新手看懂 tds、硬度、鹼度與 sca 安全帶 | `card-s6`, `card-s1`, `wiki/concepts/water-chemistry.md` |\n| 09 | 實戰起手式：新手黃金起始配方（1:16） | 整合 5 大變因成一張照做就能成功的配方卡 | `wiki/syntheses/beginner-golden-recipe.md` |\n| 10 | 喝起來不對勁？手沖風味互動除錯指南 | 教會「一次只改一個變因」的科學除錯法 | `wiki/syntheses/flavor-troubleshooting.md` |\n| 11 | 總結與知識來源對應表（wiki → 簡報） | 整理 3 大心法並列出完整 wiki 頁面與 s1–s6 出處 | `wiki/index.md`, `s1`–`s6` |\n"}};
    const NAV_GROUPS = [{"group": "知識庫總覽與規範", "items": [{"path": "wiki/index.md", "label": "Wiki 首頁總索引"}, {"path": "AGENTS.md", "label": "AGENTS.md 員工手冊"}, {"path": "wiki/log.md", "label": "Ingest 與 Lint 維護日誌"}]}, {"group": "核心原理與變因（Concepts）", "items": [{"path": "wiki/concepts/extraction-and-tds.md", "label": "萃取率與濃度 TDS"}, {"path": "wiki/concepts/grind-size-and-uniformity.md", "label": "研磨度與粒徑均勻度"}, {"path": "wiki/concepts/water-temperature-and-roast.md", "label": "水溫與烘焙度"}, {"path": "wiki/concepts/blooming-and-co2-degassing.md", "label": "悶蒸與 CO₂ 排氣"}, {"path": "wiki/concepts/dripper-geometry.md", "label": "濾杯幾何（V60 vs. 平底）"}, {"path": "wiki/concepts/water-chemistry.md", "label": "水質化學與 SCA 標準"}]}, {"group": "實戰整合（Syntheses）", "items": [{"path": "wiki/syntheses/beginner-golden-recipe.md", "label": "新手黃金起始配方"}, {"path": "wiki/syntheses/flavor-troubleshooting.md", "label": "手沖風味除錯表"}]}, {"group": "單篇來源筆記（Sources S1–S6）", "items": [{"path": "wiki/sources/S1-golden-cup-standard.md", "label": "[S1] 黃金杯標準"}, {"path": "wiki/sources/S2-grind-size-extraction.md", "label": "[S2] 研磨度與萃取"}, {"path": "wiki/sources/S3-water-temperature.md", "label": "[S3] 水溫與烘焙度"}, {"path": "wiki/sources/S4-coffee-bloom.md", "label": "[S4] 悶蒸與排氣"}, {"path": "wiki/sources/S5-dripper-geometry.md", "label": "[S5] 濾杯幾何比較"}, {"path": "wiki/sources/S6-water-chemistry.md", "label": "[S6] 咖啡水質化學"}]}, {"group": "Graph 流程與作業報告", "items": [{"path": "topic-pourover-science/report.md", "label": "作業繳交完整報告（6 大項）"}, {"path": ".agents/workflows/topic-slides.md", "label": "Workflow 規格（/topic-slides）"}, {"path": "topic-pourover-science/outline.md", "label": "簡報大綱與 Wiki 對應"}]}];

    const navContainer = document.getElementById("navContainer");
    const docContent = document.getElementById("docContent");
    const activePathEl = document.getElementById("activePath");
    const searchInput = document.getElementById("searchInput");
    let activeKey = "wiki/index.md";

    function resolveRelative(basePath, href) {
      if (href.startsWith("http://") || href.startsWith("https://")) return null;
      const clean = href.split("#")[0];
      if (PAGES[clean]) return clean;
      const baseParts = basePath.split("/").slice(0, -1);
      for (const part of clean.split("/")) {
        if (part === "." || part === "") continue;
        if (part === "..") baseParts.pop();
        else baseParts.push(part);
      }
      const candidate = baseParts.join("/");
      return PAGES[candidate] ? candidate : null;
    }

    function renderNav(filterText = "") {
      const q = filterText.trim().toLowerCase();
      navContainer.innerHTML = "";
      NAV_GROUPS.forEach((grp) => {
        const matched = grp.items.filter((it) => {
          if (!q) return true;
          const p = PAGES[it.path];
          return it.label.toLowerCase().includes(q) || (p && p.raw.includes(q));
        });
        if (!matched.length) return;
        const heading = document.createElement("div");
        heading.className = "nav-group-title";
        heading.textContent = grp.group;
        navContainer.appendChild(heading);
        matched.forEach((it) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-btn" + (it.path === activeKey ? " active" : "");
          btn.textContent = it.label;
          btn.addEventListener("click", () => openPage(it.path));
          navContainer.appendChild(btn);
        });
      });
    }

    function openPage(key) {
      const page = PAGES[key];
      if (!page) return;
      activeKey = key;
      activePathEl.textContent = page.path;
      docContent.innerHTML = page.html;
      docContent.querySelectorAll("a").forEach((a) => {
        const href = a.getAttribute("href") || "";
        if (href.startsWith("http://") || href.startsWith("https://")) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        } else {
          const resolved = resolveRelative(page.path, href);
          if (resolved) {
            a.addEventListener("click", (e) => {
              e.preventDefault();
              openPage(resolved);
            });
          }
        }
      });
      renderNav(searchInput.value);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    searchInput.addEventListener("input", () => renderNav(searchInput.value));
    openPage("wiki/index.md");
  </script>
